  <script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useRef, useCallback } = React;

/* ------------------------------------------------------------------ */
/*  Constants                                                          */
/* ------------------------------------------------------------------ */

const STORAGE = {
  session: 'cadence.session.v1',
  flags: 'cadence.flags.v1',
  prefs: 'cadence.prefs.v1',
  notes: 'cadence.notes.v1',
  history: 'cadence.history.v1',
  theme: 'cadence.theme.v1'
};

const OPTION_LETTERS = ['A', 'B', 'C', 'D', 'E', 'F'];

const SUBJECTS = [
  { key: 'Biology', label: 'Biology', short: 'Biology', icon: 'leaf', blurb: 'Cells, systems, genetics and the living world.' },
  { key: 'Chemistry', label: 'Chemistry', short: 'Chemistry', icon: 'flask', blurb: 'Reactions, bonding, organic and physical chemistry.' },
  { key: 'Physics', label: 'Physics', short: 'Physics', icon: 'atom', blurb: 'Mechanics, waves, electricity and modern physics.' },
  { key: 'English', label: 'English', short: 'English', icon: 'book', blurb: 'Vocabulary, grammar, comprehension and usage.' },
  { key: 'Psychology & Communication Skills', label: 'Psychology & Communication', short: 'Psychology', icon: 'brain', blurb: 'Behaviour, therapy, research and communication.' },
  { key: 'Miscellaneous', label: 'Miscellaneous', short: 'Misc.', icon: 'grid', blurb: 'Maths, reasoning, everyday science and mixed topics.' }
];

const SUBJECT_MAP = Object.fromEntries(SUBJECTS.map((s) => [s.key, s]));

const DATA_SOURCES = [
  { file: './data/Biology_questions.json', key: 'Biology' },
  { file: './data/Chemistry_questions.json', key: 'Chemistry' },
  { file: './data/Physics_questions.json', key: 'Physics' },
  { file: './data/English_questions.json', key: 'English' },
  { file: './data/Psychology___Communication_Skills_questions.json', key: 'Psychology & Communication Skills' },
  { file: './data/Miscellaneous_questions.json', key: 'Miscellaneous' },
  { file: './data/Miscellaneous___Unclassified_questions.json', key: 'Miscellaneous' }
];

const DEFAULT_DRAFT = {
  subjects: SUBJECTS.map((s) => s.key),
  countMode: '25',
  customCount: 40,
  mode: 'relaxed',
  timerType: 'perQuestion',
  perQuestionSeconds: 45,
  totalMinutes: 30,
  autoAdvance: 3,
  shuffle: true
};

/* ------------------------------------------------------------------ */
/*  Utilities                                                          */
/* ------------------------------------------------------------------ */

function cx(...parts) {
  return parts.filter(Boolean).join(' ');
}

function hashString(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i += 1) {
    h ^= str.charCodeAt(i);
    h = Math.imul(h, 16777619);
  }
  return (h >>> 0).toString(36);
}

function stripOptionPrefix(text) {
  return String(text || '').replace(/^\s*[A-Fa-f]\s*[\).:\-]\s*/, '').trim();
}

function normalizeText(text) {
  return stripOptionPrefix(text).toLowerCase().replace(/\s+/g, ' ').trim();
}

function resolveCorrectIndex(options, correctAnswer) {
  const ca = String(correctAnswer ?? '').trim();
  if (!Array.isArray(options) || options.length === 0) return -1;

  if (/^[A-Fa-f]$/.test(ca)) {
    const i = ca.toUpperCase().charCodeAt(0) - 65;
    if (i >= 0 && i < options.length) return i;
  }

  const pref = ca.match(/^\s*([A-Fa-f])\s*[\).:\-]\s*/);
  if (pref) {
    const i = pref[1].toUpperCase().charCodeAt(0) - 65;
    if (i >= 0 && i < options.length) return i;
  }

  const n = normalizeText(ca);
  let idx = options.findIndex((o) => normalizeText(o) === n);
  if (idx >= 0) return idx;

  idx = options.findIndex((o) => {
    const no = normalizeText(o);
    return no && (no.includes(n) || n.includes(no));
  });
  return idx;
}

function inferSourceKey(fileName) {
  const n = String(fileName || '').toLowerCase();
  if (n.includes('biolog')) return 'Biology';
  if (n.includes('chem')) return 'Chemistry';
  if (n.includes('phys')) return 'Physics';
  if (n.includes('english')) return 'English';
  if (n.includes('psych')) return 'Psychology & Communication Skills';
  return 'Miscellaneous';
}

function inferSubject(rawSubject, sourceKey) {
  if (sourceKey && SUBJECT_MAP[sourceKey]) return sourceKey;
  const s = String(rawSubject || '').toLowerCase();
  if (s.includes('biolog')) return 'Biology';
  if (s.includes('chem')) return 'Chemistry';
  if (s.includes('phys')) return 'Physics';
  if (s.includes('english')) return 'English';
  if (s.includes('psych')) return 'Psychology & Communication Skills';
  if (s.includes('misc')) return 'Miscellaneous';
  return null;
}

function normalizeQuestion(raw, sourceKey, index) {
  if (!raw || !raw.question || !Array.isArray(raw.options) || raw.options.length < 2) return null;
  const subject = inferSubject(raw.subject, sourceKey);
  if (!subject) return null;

  const options = raw.options.map((o) => stripOptionPrefix(o));
  if (options.length < 2 || options.some((o) => !o)) return null;

  const correctIndex = resolveCorrectIndex(raw.options, raw.correct_answer);
  if (correctIndex < 0 || correctIndex >= options.length) return null;

  const topic = String(raw.topic || '').trim() || 'General';
  const explanation = String(raw.explanation || '').trim() || 'No explanation was provided for this question.';
  let questionText = String(raw.question).trim();
  if (subject === 'English' && /synonym/i.test(topic) && !/\s/.test(questionText)) {
    questionText = `Choose the antonym of “${questionText}”.`;
  }
  const id = `${subject.replace(/[^a-z]+/gi, '_').toLowerCase()}_${hashString(normalizeText(questionText))}`;

  return {
    id,
    subject,
    topic,
    question: questionText,
    options,
    correctIndex,
    correctAnswer: options[correctIndex],
    explanation,
    source: String(raw.source_pdf || '').trim(),
    originalId: String(raw.original_id || raw.id || index)
  };
}

function dedupeQuestions(list) {
  const map = new Map();
  list.forEach((q) => {
    const key = normalizeText(q.question);
    const prev = map.get(key);
    if (!prev) {
      map.set(key, q);
      return;
    }
    const score = q.explanation.length + q.options.length * 12;
    const prevScore = prev.explanation.length + prev.options.length * 12;
    if (score > prevScore) map.set(key, q);
  });
  return Array.from(map.values());
}

function shuffleArray(input) {
  const a = input.slice();
  for (let i = a.length - 1; i > 0; i -= 1) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function formatClock(totalSeconds) {
  const s = Math.max(0, Math.floor(Number(totalSeconds) || 0));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  const sec = s % 60;
  if (h > 0) return `${h}:${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
  return `${String(m).padStart(2, '0')}:${String(sec).padStart(2, '0')}`;
}

function formatMinutes(seconds) {
  const m = Math.max(0, Math.round((Number(seconds) || 0) / 60));
  if (m < 1) return '< 1 min';
  return `${m} min`;
}

function formatCount(n) {
  return Number(n || 0).toLocaleString();
}

function clamp(n, min, max) {
  return Math.min(max, Math.max(min, n));
}

function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw ? JSON.parse(raw) : fallback;
  } catch (err) {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    try { window.dispatchEvent(new CustomEvent('cadence-storage-error')); } catch (e) { /* noop */ }
  }
}

function removeStorage(key) {
  try {
    localStorage.removeItem(key);
  } catch (err) {
    /* noop */
  }
}

function getSessionStats(session) {
  const ids = (session && session.questionIds) || [];
  const answers = (session && session.answers) || {};
  const answerValues = Object.values(answers);
  const total = ids.length;
  const answered = answerValues.length;
  const correct = answerValues.filter((a) => a && a.correct).length;
  const wrong = answered - correct;
  const skipped = Math.max(0, total - answered);
  const accuracy = answered ? Math.round((correct / answered) * 100) : 0;
  return {
    total,
    answered,
    correct,
    wrong,
    skipped,
    accuracy,
    elapsed: (session && session.elapsedSec) || 0,
    completion: total ? Math.round((answered / total) * 100) : 0
  };
}

/* ------------------------------------------------------------------ */
/*  Data loading                                                       */
/* ------------------------------------------------------------------ */

function diagnose(raw, sourceKey) {
  if (!raw || typeof raw !== 'object') return 'Entry is not an object';
  if (!raw.question) return 'Missing question text';
  if (!Array.isArray(raw.options) || raw.options.length < 2) return 'Needs at least 2 options';
  if (raw.options.some((o) => !stripOptionPrefix(o))) return 'Has an empty option';
  if (!inferSubject(raw.subject, sourceKey)) return 'Unknown subject';
  return 'correct_answer does not match any option';
}

async function loadQuestionBank(onProgress) {
  let done = 0;
  const total = DATA_SOURCES.length;
  const settled = await Promise.allSettled(
    DATA_SOURCES.map(async (src) => {
      try {
        const res = await fetch(src.file, { cache: 'no-store' });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        let data;
        try {
          data = await res.json();
        } catch (err) {
          throw new Error(`Invalid JSON (${err.message})`);
        }
        if (!Array.isArray(data)) throw new Error('Expected a JSON array');
        return { src, data };
      } finally {
        done += 1;
        if (onProgress) onProgress({ done, total });
      }
    })
  );

  const collected = [];
  const failed = [];
  const dropped = [];

  settled.forEach((result, i) => {
    if (result.status === 'fulfilled') {
      result.value.data.forEach((raw, idx) => {
        const q = normalizeQuestion(raw, result.value.src.key, idx);
        if (q) collected.push(q);
        else dropped.push({ file: result.value.src.file, index: idx, reason: diagnose(raw, result.value.src.key), preview: String((raw && raw.question) || '').slice(0, 70) });
      });
    } else {
      failed.push({ file: DATA_SOURCES[i].file, message: result.reason && result.reason.message ? result.reason.message : 'Could not load file' });
    }
  });

  const questions = dedupeQuestions(collected);
  return { questions, failed, dropped, duplicates: collected.length - questions.length };
}

function Modal({ open, title, children, onClose, footer, tone = 'default' }) {
  useEffect(() => {
    if (!open) return undefined;
    const onKey = (e) => {
      if (e.key === 'Escape' && onClose) onClose();
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [open, onClose]);

  if (!open) return null;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 animate-fade-up bg-black/55 backdrop-blur-[3px]" onClick={onClose} />
      <div role="dialog" aria-modal="true" className="relative w-full max-w-md animate-pop rounded-[24px] border border-line bg-card p-6 shadow-lift">

    </div>
  );
}

function AccuracyRing({ value, size = 174, stroke = 12 }) {
  const safe = clamp(Number(value) || 0, 0, 100);
  const r = (size - stroke) / 2;
  const circumference = 2 * Math.PI * r;
  const offset = circumference * (1 - safe / 100);
  return (
    <div className="relative shrink-0" style={{ width: size, height: size }}>
      <svg width={size} height={size} className="-rotate-90" aria-hidden="true">
        <circle cx={size / 2} cy={size / 2} r={r} fill="none" stroke="currentColor" className="text-line" strokeWidth={stroke} />
        <circle
          cx={size / 2}
          cy={size / 2}
          r={r}
          fill="none"
          stroke="currentColor"
          className="text-forest transition-all duration-700"
          strokeWidth={stroke}
          strokeLinecap="round"
          strokeDasharray={circumference}
          strokeDashoffset={offset}
        />
      </svg>
      <div className="absolute inset-0 grid place-items-center text-center">
        <div>
          <div className="font-display text-5xl leading-none text-ink">
            {safe}
            <span className="text-2xl text-muted">%</span>
          </div>
          <div className="mt-1 text-[10px] font-medium text-muted">accuracy</div>
        </div>
      </div>
    </div>
  );
}

  return (

      onClick={onClick}
      aria-pressed={selected}
      className={cx(
        'group flex items-center gap-3 rounded-2xl border p-3.5 text-left transition',
        selected ? 'border-forest/40 bg-mint/60' : 'border-line bg-card hover:border-forest/25 hover:bg-mint/25'
      )}
    >
      <div className={cx('grid h-10 w-10 shrink-0 place-items-center rounded-xl transition', selected ? 'bg-forest text-paper' : 'bg-paper text-muted group-hover:text-forest')}>
        <SubjectIcon subject={subject.key} className="h-5 w-5" />
      </div>
      <div className="min-w-0 flex-1">
        <div className="text-sm font-semibold leading-snug text-ink">{subject.label}</div>
        <div className="mt-0.5 text-[11px] text-muted">{formatCount(count)} questions</div>
      </div>
      <CheckMark checked={selected} />
    </button>
  );
}

function SubjectPicker({ draft, setDraft, subjectCounts }) {
  const selected = draft.subjects || [];
  const selectedSet = new Set(selected);
  const allSelected = selected.length === SUBJECTS.length;
  const update = (patch) => setDraft((d) => ({ ...d, ...patch }));

  const toggleSubject = (key) => {
    const next = selectedSet.has(key) ? selected.filter((k) => k !== key) : [...selected, key];
    update({ subjects: next });
  };

  return (
    <section>
      <div className="flex items-end justify-between gap-4">
        <div>
          <p className="text-xs font-medium text-forest">01 · Subject</p>
          <h2 className="mt-1 font-display text-3xl leading-tight text-ink">Choose your ground</h2>
        </div>
        <div className="flex shrink-0 gap-2">
          <button
            type="button"
            onClick={() => update({ subjects: SUBJECTS.map((s) => s.key) })}
            className="rounded-lg px-2.5 py-1.5 text-[11px] font-medium text-muted transition hover:bg-mint/60 hover:text-ink"
          >
            Select all
          </button>
          <button
            type="button"
            onClick={() => update({ subjects: [] })}
            className="rounded-lg px-2.5 py-1.5 text-[11px] font-medium text-muted transition hover:bg-rose-soft hover:text-rose"
          >
            Clear
          </button>
        </div>
      </div>

      <div className="mt-4 grid gap-2.5 sm:grid-cols-2">
        {SUBJECTS.map((subject) => (
          <SubjectCard
            key={subject.key}
            subject={subject}
            count={subjectCounts[subject.key] || 0}
            selected={selectedSet.has(subject.key)}
            onClick={() => toggleSubject(subject.key)}
          />
        ))}

        <button
          type="button"
          onClick={() => update({ subjects: SUBJECTS.map((s) => s.key), shuffle: true })}
          className={cx(
            'flex items-center gap-3 rounded-2xl border p-3.5 text-left transition sm:col-span-2',
            allSelected ? 'border-forest/40 bg-mint/60' : 'border-line bg-card hover:border-forest/25 hover:bg-mint/25'
          )}
        >
          <div className={cx('grid h-10 w-10 shrink-0 place-items-center rounded-xl transition', allSelected ? 'bg-forest text-paper' : 'bg-paper text-muted')}>
            <Icon name="shuffle" className="h-5 w-5" />
          </div>
          <div className="min-w-0 flex-1">
            <div className="text-sm font-semibold text-ink">Shuffle all subjects</div>
            <div className="mt-0.5 text-[11px] text-muted">Mix every subject and topic in the bank</div>
          </div>
          <CheckMark checked={allSelected} />
        </button>
      </div>
    </section>
  );
}

function LengthPicker({ draft, setDraft, available }) {
  const update = (patch) => setDraft((d) => ({ ...d, ...patch }));
  const countMode = draft.countMode;
  const options = [
    { key: 'all', label: `All${available ? ` (${formatCount(available)})` : ''}` },
    { key: '25', label: '25' },
    { key: '50', label: '50' },
    { key: '100', label: '100' },
    { key: 'custom', label: 'Custom' }
  ];

  return (
    <section>
      <p className="text-xs font-medium text-forest">02 · Length</p>
      <h2 className="mt-1 font-display text-3xl leading-tight text-ink">Size the drill</h2>
      <div className="mt-4 rounded-2xl border border-line bg-card p-4">
        <div className="flex flex-wrap gap-2">
          {options.map((opt) => {
            const disabled = opt.key !== 'all' && opt.key !== 'custom' && available < Number(opt.key);
            return (
              <ChoiceChip key={opt.key} active={countMode === opt.key} disabled={disabled || !available} onClick={() => update({ countMode: opt.key })}>
                {opt.label}
              </ChoiceChip>
            );
          })}
        </div>

        {countMode === 'custom' && (
          <div className="mt-3 flex flex-wrap items-center gap-3 rounded-xl border border-line bg-paper/60 px-3 py-2">
            <input
              type="number"
              min="1"
              max={Math.max(1, available)}
              value={draft.customCount}
              onChange={(e) => update({ customCount: clamp(Number(e.target.value) || 1, 1, Math.max(1, available)) })}
              className="w-20 bg-transparent font-mono text-sm text-ink outline-none"
              aria-label="Custom number of questions"
            />
            <span className="text-xs text-muted">questions, up to {formatCount(available)}</span>
          </div>
        )}

        <p className="mt-3 text-xs text-muted">
          {available ? `${formatCount(available)} questions available in this selection.` : 'Select at least one subject to see your pool.'}
        </p>
      </div>
    </section>
  );
}

function ModeCard({ active, onClick, icon, title, desc, tone = 'forest' }) {
  const activeClass = tone === 'clay' ? 'border-clay/35 bg-amber-soft' : 'border-forest/40 bg-mint/60';
  const iconClass = tone === 'clay' ? 'bg-clay text-white' : 'bg-forest text-paper';
  return (
    <button
      type="button"
      onClick={onClick}
      aria-pressed={active}
      className={cx('group rounded-2xl border p-4 text-left transition', active ? activeClass : 'border-line bg-card hover:border-forest/25 hover:bg-mint/20')}
    >
      <div className="flex items-start gap-3">
        <div className={cx('grid h-9 w-9 shrink-0 place-items-center rounded-xl transition', active ? iconClass : 'bg-paper text-muted group-hover:text-forest')}>
          <Icon name={icon} className="h-4 w-4" />
        </div>
        <div className="min-w-0 flex-1">
          <div className="flex items-center justify-between gap-2">
            <span className="text-sm font-semibold text-ink">{title}</span>
            {active && (
              <span className="grid h-5 w-5 place-items-center rounded-full bg-forest text-paper">
                <Icon name="check" className="h-3 w-3" strokeWidth={3} />
              </span>
            )}
          </div>
          <p className="mt-1 text-xs leading-relaxed text-muted">{desc}</p>
        </div>
      </div>
    </button>
  );
}

function PacePicker({ draft, setDraft }) {
  const update = (patch) => setDraft((d) => ({ ...d, ...patch }));
  const timed = draft.mode === 'timed';

  return (
    <section>
      <p className="text-xs font-medium text-forest">03 · Pace</p>
      <h2 className="mt-1 font-display text-3xl leading-tight text-ink">Set the pace</h2>
      <div className="mt-4 grid gap-3 sm:grid-cols-2">
        <ModeCard
          active={!timed}
          onClick={() => update({ mode: 'relaxed' })}
          icon="feather"
          title="Relaxed practice"
          desc="No clock. Read, reason, and learn from every explanation."
          tone="forest"
        />
        <ModeCard
          active={timed}
          onClick={() => update({ mode: 'timed' })}
          icon="bolt"
          title="Timed speed drill"
          desc="A countdown keeps you honest and builds exam stamina."
          tone="clay"
        />
      </div>

      {timed && (
        <div className="mt-3 animate-fade-up rounded-2xl border border-clay/20 bg-amber-soft/60 p-4">
          <div className="flex flex-wrap items-center justify-between gap-3">
            <span className="text-sm font-medium text-ink">Timer style</span>
            <div className="flex rounded-lg border border-line bg-card p-1">
              <button
                type="button"
                onClick={() => update({ timerType: 'perQuestion' })}
                className={cx('rounded-md px-3 py-1.5 text-[11px] font-medium transition', draft.timerType === 'perQuestion' ? 'bg-forest text-paper shadow-sm' : 'text-muted hover:text-ink')}
              >
                Per question
              </button>
              <button
                type="button"
                onClick={() => update({ timerType: 'total' })}
                className={cx('rounded-md px-3 py-1.5 text-[11px] font-medium transition', draft.timerType === 'total' ? 'bg-forest text-paper shadow-sm' : 'text-muted hover:text-ink')}
              >
                Whole session
              </button>
            </div>
          </div>

          <div className="mt-3 flex flex-wrap gap-2">
            {draft.timerType === 'perQuestion'
              ? [30, 45, 60, 90].map((sec) => (
                  <ChoiceChip key={sec} active={draft.perQuestionSeconds === sec} onClick={() => update({ perQuestionSeconds: sec })}>
                    {sec}s
                  </ChoiceChip>
                ))
              : [10, 20, 30, 45, 60].map((min) => (
                  <ChoiceChip key={min} active={draft.totalMinutes === min} onClick={() => update({ totalMinutes: min })}>
                    {min} min
                  </ChoiceChip>
                ))}
          </div>
          <p className="mt-3 text-[11px] text-muted">
            {draft.timerType === 'perQuestion'
              ? 'The question locks when the clock reaches zero and reveals the answer.'
              : 'The drill ends automatically when the session clock runs out.'}
          </p>
        </div>
      )}
    </section>
  );
}

function FeedbackSettings({ draft, setDraft }) {
  const update = (patch) => setDraft((d) => ({ ...d, ...patch }));
  return (
    <section>
      <p className="text-xs font-medium text-forest">04 · Feedback</p>
      <h2 className="mt-1 font-display text-3xl leading-tight text-ink">Fine-tune the loop</h2>
      <div className="mt-4 grid gap-3 sm:grid-cols-2">
        <div className="rounded-2xl border border-line bg-card p-4">
          <div className="flex items-center gap-2 text-sm font-medium text-ink">
            <Icon name="checkCircle" className="h-4 w-4 text-forest" /> Pause after correct
          </div>
          <p className="mt-1 text-xs text-muted">A short beat to absorb the explanation.</p>
          <div className="mt-3 flex flex-wrap gap-2">
            {[1, 3, 5, 8].map((sec) => (
              <ChoiceChip key={sec} active={draft.autoAdvance === sec} onClick={() => update({ autoAdvance: sec })}>
                {sec}s
              </ChoiceChip>
            ))}
          </div>
        </div>

        <div className="rounded-2xl border border-line bg-card p-4">
          <div className="flex items-center justify-between gap-3">
            <div>
              <div className="flex items-center gap-2 text-sm font-medium text-ink">
                <Icon name="shuffle" className="h-4 w-4 text-forest" /> Shuffle questions
              </div>
              <p className="mt-1 text-xs text-muted">Randomize the order of the drill.</p>
            </div>
            <Toggle checked={draft.shuffle} onChange={() => update({ shuffle: !draft.shuffle })} label="Shuffle questions" />
          </div>
          <div className="mt-3 rounded-lg bg-paper/70 px-3 py-2 text-[11px] leading-relaxed text-muted">Wrong answers always stop for review. No skipping past a mistake.</div>
        </div>
      </div>
    </section>
  );
}

function SessionBrief({ draft, available, target, estSec, onStart, allSelected, selected, finishedSession, finishedStats, onViewSummary }) {
  const timed = draft.mode === 'timed';
  const subjectSummary = allSelected
    ? 'All six subjects'
    : selected.length === 0
      ? 'None'
      : selected.length <= 2
        ? selected.map((k) => (SUBJECT_MAP[k] ? SUBJECT_MAP[k].short : k)).join(' + ')
        : `${selected.length} subjects`;

  return (
    <aside className="lg:sticky lg:top-24">
      <div className="relative overflow-hidden rounded-[28px] bg-ink p-6 text-paper shadow-lift">
        <div className="pointer-events-none absolute -right-16 -top-16 h-48 w-48 rounded-full border border-white/10" />
        <div className="pointer-events-none absolute -right-8 -top-8 h-28 w-28 rounded-full border border-white/10" />
        <p className="text-[11px] text-paper/65">Session brief</p>
        <h3 className="mt-1 font-display text-3xl leading-tight">Ready when you are.</h3>

        <dl className="mt-6 space-y-3 text-sm">
          <div className="flex items-start justify-between gap-4 border-b border-white/10 pb-3">
            <dt className="shrink-0 text-paper/65">Subjects</dt>
            <dd className="text-right text-[13px] leading-snug">{subjectSummary}</dd>
          </div>
          <div className="flex items-start justify-between gap-4 border-b border-white/10 pb-3">
            <dt className="shrink-0 text-paper/65">Questions</dt>
            <dd className="text-right font-medium">
              {formatCount(target)} <span className="text-paper/65">of {formatCount(available)}</span>
            </dd>
          </div>
          <div className="flex items-start justify-between gap-4 border-b border-white/10 pb-3">
            <dt className="shrink-0 text-paper/65">Pace</dt>
            <dd className="text-right text-[13px] leading-snug">
              {timed ? (draft.timerType === 'perQuestion' ? `${draft.perQuestionSeconds}s per question` : `${draft.totalMinutes} min session`) : 'Relaxed'}
            </dd>
          </div>
          <div className="flex items-start justify-between gap-4 border-b border-white/10 pb-3">
            <dt className="shrink-0 text-paper/65">Correct pause</dt>
            <dd className="text-right">{draft.autoAdvance}s</dd>
          </div>
          <div className="flex items-start justify-between gap-4">
            <dt className="shrink-0 text-paper/65">Est. time</dt>
            <dd className="text-right">{formatMinutes(estSec)}</dd>
          </div>
        </dl>

        <button
          type="button"
          onClick={onStart}
          disabled={!target}
          className="mt-6 flex w-full items-center justify-between gap-3 rounded-xl bg-paper px-4 py-3.5 text-sm font-semibold text-ink transition hover:bg-white disabled:opacity-40"
        >
          <span>{target ? `Start ${formatCount(target)}-question drill` : 'Select a subject'}</span>
          <span className="grid h-7 w-7 place-items-center rounded-full bg-ink text-paper">
            <Icon name="arrowRight" className="h-3.5 w-3.5" />
          </span>
        </button>
        <p className="mt-3 text-center text-[11px] text-paper/65">Progress saves automatically in this browser.</p>
      </div>

      {finishedSession && finishedStats && (
        <button
          type="button"
          onClick={onViewSummary}
          className="mt-3 w-full rounded-2xl border border-line bg-card p-4 text-left transition hover:border-forest/30 hover:shadow-card"
        >
          <div className="flex items-center justify-between">
            <span className="text-xs font-medium text-muted">Last result</span>
            <Icon name="arrowUpRight" className="h-4 w-4 text-muted" />
          </div>
          <div className="mt-2 flex items-end gap-2">
            <span className="font-display text-3xl leading-none text-ink">{finishedStats.accuracy}%</span>
            <span className="pb-0.5 text-xs text-muted">
              {finishedStats.correct}/{finishedStats.answered} correct
            </span>
          </div>
        </button>
      )}
    </aside>
  );
}

function Dashboard({ questions, subjectCounts, topicCount, flagsCount, draft, setDraft, onStart, session, onResume, onDiscard, onViewSummary, onNavigate }) {
  const selected = draft.subjects || [];
  const selectedSet = new Set(selected);
  const available = SUBJECTS.reduce((sum, subject) => sum + (selectedSet.has(subject.key) ? subjectCounts[subject.key] || 0 : 0), 0);
  const allSelected = selected.length === SUBJECTS.length;
  const countMode = draft.countMode;
  const rawTarget = countMode === 'all' ? available : countMode === 'custom' ? Number(draft.customCount) || 0 : Number(countMode) || 0;
  const target = clamp(rawTarget, 0, available);
  const timed = draft.mode === 'timed';
  const estSec = timed ? (draft.timerType === 'total' ? draft.totalMinutes * 60 : target * draft.perQuestionSeconds) : target * 42;
  const activeSession = session && !session.finished ? session : null;
  const finishedSession = session && session.finished ? session : null;
  const finishedStats = finishedSession ? getSessionStats(finishedSession) : null;

  return (
    <div className="relative z-10">
      {activeSession && (
        <div className="mt-6 flex flex-col gap-3 rounded-2xl border border-forest/20 bg-mint/70 p-4 sm:flex-row sm:items-center">
          <div className="grid h-10 w-10 shrink-0 place-items-center rounded-full bg-forest text-paper">
            <Icon name="rotate" className="h-4 w-4" />
          </div>
          <div className="min-w-0 flex-1">
            <div className="text-sm font-semibold text-ink">Session in progress</div>
            <div className="text-xs text-muted">
              Question {activeSession.index + 1} of {activeSession.questionIds.length} · {formatClock(activeSession.elapsedSec)} elapsed
            </div>
          </div>
          <div className="flex items-center gap-2">
            <button type="button" onClick={onResume} className="inline-flex items-center gap-1.5 rounded-xl bg-forest px-3.5 py-2 text-xs font-semibold text-paper transition hover:bg-forest-dark">
              Resume <Icon name="arrowRight" className="h-3.5 w-3.5" />
            </button>
            <button type="button" onClick={onDiscard} className="rounded-xl px-3 py-2 text-xs font-medium text-muted transition hover:bg-white/60 hover:text-rose">
              Discard
            </button>
          </div>
        </div>
      )}

      <DashboardHero questions={questions} topicCount={topicCount} flagsCount={flagsCount} onNavigate={onNavigate} />

      <div className="grid gap-8 lg:grid-cols-[1fr_340px] lg:items-start">
        <div className="space-y-10">
          <SubjectPicker draft={draft} setDraft={setDraft} subjectCounts={subjectCounts} />
          <LengthPicker draft={draft} setDraft={setDraft} available={available} />
          <PacePicker draft={draft} setDraft={setDraft} />
          <FeedbackSettings draft={draft} setDraft={setDraft} />
        </div>

        <SessionBrief
          draft={draft}
          available={available}
          target={target}
          estSec={estSec}
          onStart={onStart}
          allSelected={allSelected}
          selected={selected}
          finishedSession={finishedSession}
          finishedStats={finishedStats}
          onViewSummary={onViewSummary}
        />
      </div>

      <div className="mt-12 rounded-2xl border border-line bg-card/60 p-5 text-sm text-muted">
        <div className="flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
          <div className="flex flex-wrap items-center gap-2">
            <Icon name="keyboard" className="h-4 w-4 text-forest" />
            <span>
              <Kbd>1</Kbd>–<Kbd>5</Kbd> or <Kbd>A</Kbd>–<Kbd>E</Kbd> to answer, <Kbd>F</Kbd> to flag, <Kbd>S</Kbd> to skip, <Kbd>Enter</Kbd> to continue.
            </span>
          </div>
          <button type="button" onClick={() => onNavigate('flagged')} className="inline-flex items-center gap-1.5 text-xs font-medium text-forest hover:underline">
            Open flagged hub <Icon name="arrowRight" className="h-3.5 w-3.5" />
          </button>
        </div>
      </div>
    </div>
  );
}

/* ------------------------------------------------------------------ */
/*  Practice engine                                                    */

function QuestionOption({ option, index, state, onClick, disabled }) {
  return (
    <button
      type="button"
      onClick={onClick}
      disabled={disabled}
      className={cx(
        'group flex w-full items-start gap-3 rounded-xl border px-3.5 py-3 text-left transition-all duration-200',
        state === 'correct' && 'border-forest/60 bg-mint',
        state === 'wrong' && 'border-rose/50 bg-rose-soft',
        state === 'dim' && 'border-line/60 bg-white/50 opacity-60',
        state === 'default' && 'border-line bg-white hover:border-forest/35 hover:bg-mint/40 hover:shadow-sm'
      )}
    >
      <span
        className={cx(
          'mt-0.5 grid h-7 w-7 shrink-0 place-items-center rounded-lg border text-[12px] font-semibold transition',
          state === 'correct'
            ? 'border-forest bg-forest text-paper'
            : state === 'wrong'
              ? 'border-rose bg-rose text-white'
              : 'border-line bg-paper text-muted group-hover:border-forest/30 group-hover:text-ink'
        )}
      >
        {state === 'correct' ? (
          <Icon name="check" className="h-3.5 w-3.5" strokeWidth={2.6} />
        ) : state === 'wrong' ? (
          <Icon name="x" className="h-3.5 w-3.5" strokeWidth={2.6} />
        ) : (
          OPTION_LETTERS[index]
        )}
      </span>
      <span className={cx('pt-0.5 text-[15px] leading-relaxed', state === 'dim' ? 'text-muted' : 'text-ink')}>{option}</span>
      <span className="ml-auto hidden pt-1 font-mono text-[10px] text-muted/60 group-hover:block">{index + 1}</span>
    </button>
  );
}

function TimerPill({ timed, timerType, perQuestionLeft, totalLeft, elapsed, warning }) {
  if (!timed) {
    return (
      <div className="flex items-center gap-2 rounded-full border border-line bg-card px-3 py-1.5 text-xs text-muted">
        <Icon name="clock" className="h-3.5 w-3.5 text-forest" />
        <span className="font-mono tabular text-ink">{formatClock(elapsed)}</span>
        <span className="hidden sm:inline">elapsed</span>
      </div>
    );
  }

  const value = timerType === 'perQuestion' ? perQuestionLeft : totalLeft;
  return (
    <div
      className={cx(
        'flex items-center gap-2 rounded-full border px-3 py-1.5 text-xs transition-colors',
        warning ? 'border-rose/30 bg-rose-soft text-rose' : 'border-line bg-card text-muted'
      )}
    >
      <Icon name="clock" className={cx('h-3.5 w-3.5', warning ? 'text-rose' : 'text-forest')} />
      <span className={cx('font-mono tabular', warning ? 'text-rose' : 'text-ink')}>{formatClock(value || 0)}</span>
      <span className="hidden sm:inline">{timerType === 'perQuestion' ? 'this question' : 'left'}</span>
    </div>
  );
}

function PracticeHeader({ index, total, progress, timed, timerType, perQuestionLeft, totalLeft, elapsed, warning, onExit, onToggleFlag, isFlagged, onOpenNav, answeredCount }) {
  return (
    <div className="sticky top-0 z-30 border-b border-line bg-paper/90 backdrop-blur-xl">
      <div className="mx-auto flex h-16 max-w-4xl items-center gap-3 px-5">
        <button
          type="button"
          onClick={onExit}
          className="inline-flex items-center gap-1.5 rounded-lg px-2 py-1.5 text-xs font-medium text-muted transition hover:bg-line/50 hover:text-ink"
        >
          <Icon name="arrowLeft" className="h-4 w-4" />
          <span className="hidden sm:inline">Exit</span>
        </button>

        <div className="mx-auto flex items-center gap-3">
          <button type="button" onClick={onOpenNav} aria-label="Open question navigator" className="inline-flex items-center gap-1.5 rounded-lg border border-line bg-card px-3 py-2 text-xs font-medium text-muted transition hover:border-forest/50 hover:text-ink">
            <Icon name="grid" className="h-3.5 w-3.5 text-forest" />
            <span className="text-ink">{index + 1}</span> / {total}
            <span className="hidden sm:inline">· {answeredCount} done</span>
          </button>
          <div className="hidden h-1.5 w-24 overflow-hidden rounded-full bg-line sm:block">
            <div className="h-full rounded-full bg-forest transition-all duration-300" style={{ width: `${progress}%` }} />
          </div>
        </div>

        <TimerPill
          timed={timed}
          timerType={timerType}
          perQuestionLeft={perQuestionLeft}
          totalLeft={totalLeft}
          elapsed={elapsed}
          warning={warning}
        />

        <ThemeToggle className="hidden sm:grid" />
        <button
          type="button"
          onClick={onToggleFlag}
          aria-pressed={isFlagged}
          aria-label={isFlagged ? 'Remove flag' : 'Flag this question for review'}
          className={cx(
            'grid h-10 w-10 place-items-center rounded-full border transition',
            isFlagged ? 'border-amber/30 bg-amber-soft text-amber' : 'border-line bg-card text-muted hover:border-amber/30 hover:text-amber'
          )}
        >
          <Icon name="flag" className="h-4 w-4" />
        </button>
      </div>
      <div className="h-0.5 bg-line/60">
        <div className="h-full bg-forest transition-all duration-300" style={{ width: `${progress}%` }} />
      </div>
    </div>
  );
}

function FeedbackPanel({ question, answer, autoLeft, autoTotal, isLast, onNext }) {
  const correct = answer.correct;
  const timedOut = answer.timedOut;
  const remaining = autoLeft == null ? autoTotal : autoLeft;
  const barWidth = autoTotal ? Math.max(0, Math.min(100, (remaining / autoTotal) * 100)) : 0;

  return (
    <div
      aria-live="polite"
      className={cx('mt-6 overflow-hidden rounded-2xl border', correct ? 'border-forest/25 bg-mint/60' : 'border-rose/20 bg-rose-soft/60')}
    >
      <div className="p-5 md:p-6">
        <div className="flex items-start gap-3">
          <div className={cx('mt-0.5 grid h-8 w-8 shrink-0 place-items-center rounded-full', correct ? 'bg-forest text-paper' : 'bg-rose text-white')}>
            <Icon name={correct ? 'check' : 'x'} className="h-4 w-4" strokeWidth={2.6} />
          </div>
          <div className="min-w-0 flex-1">
            <div className="flex flex-wrap items-center gap-2">
              <h3 className={cx('text-base font-semibold', correct ? 'text-forest-dark' : 'text-rose')}>
                {correct ? 'Correct.' : timedOut ? 'Time’s up.' : 'Not quite.'}
              </h3>
              {!correct && (
                <span className="rounded-full bg-white/70 px-2 py-0.5 text-[11px] font-medium text-rose">
                  Correct answer: {OPTION_LETTERS[question.correctIndex]}
                </span>
              )}
            </div>

            {!correct && <p className="mt-1 text-sm font-medium leading-relaxed text-ink">{question.options[question.correctIndex]}</p>}
            <p className="mt-2 text-sm leading-relaxed text-muted">{question.explanation}</p>

            {correct ? (
              <div className="mt-4 flex flex-wrap items-center gap-3">
                <div className="h-1 min-w-24 flex-1 overflow-hidden rounded-full bg-forest/15">
                  <div className="h-full bg-forest transition-all duration-1000 ease-linear" style={{ width: `${barWidth}%` }} />
                </div>
                <span className="text-xs font-medium text-forest">
                  {isLast ? 'Results' : 'Next'} in {remaining}s
                </span>
                <button
                  type="button"
                  onClick={onNext}
                  className="inline-flex items-center gap-1.5 rounded-lg border border-forest/20 bg-white/70 px-3 py-1.5 text-xs font-semibold text-forest transition hover:bg-white"
                >
                  {isLast ? 'See results' : 'Next now'} <Icon name="arrowRight" className="h-3.5 w-3.5" />
                </button>
              </div>
            ) : (
              <div className="mt-4 flex flex-wrap items-center justify-between gap-3">
                <button
                  type="button"
                  onClick={onNext}
                  className="inline-flex items-center gap-2 rounded-xl bg-ink px-4 py-2.5 text-sm font-semibold text-paper transition hover:bg-forest-dark"
                >
                  {isLast ? 'See results' : 'Next question'} <Icon name="arrowRight" className="h-4 w-4" />
                </button>
                <span className="text-[11px] text-muted">Press Enter</span>
              </div>
            )}
          </div>
        </div>
      </div>
    </div>
  );
}

function Practice({ questionsById, session, setSession, flags, toggleFlag, onExit, onFinish, prefs, showToast, paused }) {
  const ids = session.questionIds || [];
  const index = clamp(session.index || 0, 0, Math.max(0, ids.length - 1));
  const question = questionsById[ids[index]];
  const answer = question ? session.answers[question.id] || null : null;
  const answered = !!answer;
  const isLast = index >= ids.length - 1;
  const config = session.config || DEFAULT_DRAFT;
  const timed = config.mode === 'timed';
  const perQuestion = timed && config.timerType === 'perQuestion';
  const totalTimed = timed && config.timerType === 'total';
  const [timeLeft, setTimeLeft] = useState(perQuestion ? config.perQuestionSeconds : null);
  const [autoLeft, setAutoLeft] = useState(null);
  const [navOpen, setNavOpen] = useState(false);

  const timeoutRef = useRef(null);
  const advanceRef = useRef(null);

  const selectOption = useCallback(
    (optionIndex) => {
      if (!question || answered || paused) return;
      const correct = optionIndex === question.correctIndex;
      setSession((prev) => {
        if (!prev || prev.answers[question.id]) return prev;
        return {
          ...prev,
          answers: {
            ...prev.answers,
            [question.id]: { selectedIndex: optionIndex, correct, timedOut: false, answeredAt: Date.now() }
          }
        };
      });
    },
    [answered, paused, question, setSession]
  );

  const handleTimeout = useCallback(() => {
    if (!question || answered || paused) return;
    setSession((prev) => {
      if (!prev || prev.answers[question.id]) return prev;
      return {
        ...prev,
        answers: {
          ...prev.answers,
          [question.id]: { selectedIndex: null, correct: false, timedOut: true, answeredAt: Date.now() }
        }
      };
    });
    showToast('Time’s up for that question.', 'clock');
  }, [answered, paused, question, setSession, showToast]);

  const advance = useCallback(() => {
    setAutoLeft(null);
    if (!answered) return;
    if (index < ids.length - 1) {
      setSession((prev) => (prev ? { ...prev, index: index + 1 } : prev));
    } else {
      const firstOpen = ids.findIndex((id) => !session.answers[id]);
      if (firstOpen >= 0) {
        setSession((prev) => (prev ? { ...prev, index: firstOpen } : prev));
        showToast('Jumped to your first unanswered question.', 'grid');
      } else {
        onFinish('complete');
      }
    }
  }, [answered, ids, index, onFinish, session.answers, setSession, showToast]);

  const goTo = useCallback(
    (i) => {
      setAutoLeft(null);
      setSession((prev) => (prev ? { ...prev, index: clamp(i, 0, prev.questionIds.length - 1) } : prev));
    },
    [setSession]
  );

  const skip = useCallback(() => {
    if (!question || answered || paused) return;
    setSession((prev) => {
      if (!prev) return prev;
      const nextSkipped = { ...prev.skipped, [question.id]: true };
      if (index < ids.length - 1) return { ...prev, skipped: nextSkipped, index: index + 1 };
      return { ...prev, skipped: nextSkipped };
    });
    if (index >= ids.length - 1) showToast('That was the last question. Open the grid to review or finish.', 'grid');
  }, [answered, ids.length, index, paused, question, setSession, showToast]);

  timeoutRef.current = handleTimeout;
  advanceRef.current = advance;

  useEffect(() => {
    if (!perQuestion || answered || paused) return undefined;
    let remaining = config.perQuestionSeconds;
    setTimeLeft(remaining);
    const interval = setInterval(() => {
      remaining -= 1;
      setTimeLeft(remaining);
      if (remaining <= 0) {
        clearInterval(interval);
        if (timeoutRef.current) timeoutRef.current();
      }
    }, 1000);
    return () => clearInterval(interval);
  }, [answered, config.perQuestionSeconds, index, paused, perQuestion]);

  useEffect(() => {
    if (!answer || !answer.correct || paused) {
      setAutoLeft(null);
      return undefined;
    }
    let remaining = prefs.autoAdvance;
    setAutoLeft(remaining);
    const interval = setInterval(() => {
      remaining -= 1;
      setAutoLeft(remaining);
      if (remaining <= 0) {
        clearInterval(interval);
        if (advanceRef.current) advanceRef.current();
      }
    }, 1000);
    return () => clearInterval(interval);
  }, [answer, index, paused, prefs.autoAdvance]);

  useEffect(() => {
    if (paused) return undefined;
    const interval = setInterval(() => {
      setSession((prev) => (prev && !prev.finished ? { ...prev, elapsedSec: (prev.elapsedSec || 0) + 1 } : prev));
    }, 1000);
    return () => clearInterval(interval);
  }, [paused, session.id, setSession]);

  useEffect(() => {
    if (!totalTimed || paused) return;
    if ((session.elapsedSec || 0) >= config.totalMinutes * 60) onFinish('time');
  }, [config.totalMinutes, onFinish, paused, session.elapsedSec, totalTimed]);

  useEffect(() => {
    const onKey = (e) => {
      if (paused || navOpen || e.metaKey || e.ctrlKey || e.altKey) return;
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT' || (e.target && e.target.isContentEditable)) return;

      const key = e.key.toLowerCase();
      if (e.key === 'ArrowLeft' || key === 'p') { e.preventDefault(); goTo(index - 1); return; }
      if (e.key === 'ArrowRight' || key === 'n') { e.preventDefault(); goTo(index + 1); return; }
      if (key === 'g') { e.preventDefault(); setNavOpen(true); return; }
      if (!answered) {
        let optionIndex = -1;
        if (/^[1-5]$/.test(key)) optionIndex = Number(key) - 1;
        else if (/^[a-e]$/.test(key)) optionIndex = key.charCodeAt(0) - 97;

        if (optionIndex >= 0 && question && optionIndex < question.options.length) {
          e.preventDefault();
          selectOption(optionIndex);
          return;
        }
        if (key === 'f' && question) {
          e.preventDefault();
          toggleFlag(question.id);
          return;
        }
        if (key === 's') {
          e.preventDefault();
          skip();
        }
      } else if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        advance();
      } else if (key === 'f' && question) {
        e.preventDefault();
        toggleFlag(question.id);
      }
    };

    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [advance, answered, goTo, index, navOpen, paused, question, selectOption, skip, toggleFlag]);

  if (!question) {
    return (
      <div className="grid min-h-screen place-items-center bg-paper px-6">
        <div className="text-center">
          <h1 className="font-display text-3xl text-ink">This question is unavailable.</h1>
          <button type="button" onClick={onExit} className="mt-4 rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper">
            Back to dashboard
          </button>
        </div>
      </div>
    );
  }

  const isFlagged = flags.has(question.id);
  const progress = ((index + (answered ? 1 : 0)) / Math.max(1, ids.length)) * 100;
  const totalLeft = totalTimed ? Math.max(0, config.totalMinutes * 60 - (session.elapsedSec || 0)) : null;
  const warning = perQuestion ? timeLeft != null && timeLeft <= 10 : totalTimed ? totalLeft <= 30 : false;
  const compact = question.options.length === 4 && question.options.every((o) => o.length <= 48);

  const stateFor = (i) => {
    if (!answer) return 'default';
    if (i === question.correctIndex) return 'correct';
    if (answer.selectedIndex === i) return 'wrong';
    return 'dim';
  };

  return (
    <div className="min-h-screen bg-paper">
      <PracticeHeader
        index={index}
        total={ids.length}
        progress={progress}
        timed={timed}
        timerType={config.timerType}
        perQuestionLeft={timeLeft}
        totalLeft={totalLeft}
        elapsed={session.elapsedSec || 0}
        warning={warning}
        onExit={onExit}
        onToggleFlag={() => toggleFlag(question.id)}
        isFlagged={isFlagged}
        onOpenNav={() => setNavOpen(true)}
        answeredCount={Object.keys(session.answers).length}
      />

      <main className="mx-auto max-w-4xl px-5 pb-24 pt-8 md:pt-12">
        <div className="mb-5 flex items-center justify-between gap-3 text-xs text-muted">
          <div className="flex min-w-0 items-center gap-2">
            <span className="grid h-6 w-6 shrink-0 place-items-center rounded-md bg-mint text-forest">
              <SubjectIcon subject={question.subject} className="h-3.5 w-3.5" />
            </span>
            <span className="font-medium text-ink">{question.subject}</span>
            <span className="text-line">/</span>
            <span className="truncate">{question.topic}</span>
          </div>
          <div className="hidden items-center gap-1.5 md:flex">
            <Kbd>1</Kbd>–<Kbd>{question.options.length}</Kbd> answer
            <span className="mx-1 text-line">·</span>
            <Kbd>F</Kbd> flag
            <span className="mx-1 text-line">·</span>
            <Kbd>S</Kbd> skip
            <span className="mx-1 text-line">·</span>
            <Kbd>←</Kbd><Kbd>→</Kbd> move
            <span className="mx-1 text-line">·</span>
            <Kbd>G</Kbd> grid
          </div>
        </div>

        <section className="animate-fade-up rounded-[26px] border border-line bg-card p-5 shadow-card md:p-8">
          <div className="flex items-start justify-between gap-4">
            <div className="min-w-0 flex-1">
              <div className="flex flex-wrap items-center gap-2">
                <span className="rounded-full bg-mint px-2.5 py-1 text-[11px] font-semibold text-forest">{question.subject}</span>
                <span className="text-[11px] text-muted">{question.topic}</span>
              </div>
              <h1 className="mt-5 font-serif text-[22px] font-semibold leading-[1.4] tracking-[-0.01em] text-ink md:text-[27px]">{question.question}</h1>
            </div>

            <button
              type="button"
              onClick={() => toggleFlag(question.id)}
              aria-pressed={isFlagged}
              className={cx(
                'flex shrink-0 items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-medium transition',
                isFlagged ? 'border-amber/30 bg-amber-soft text-amber' : 'border-line bg-white text-muted hover:border-amber/30 hover:text-amber'
              )}
            >
              <Icon name="flag" className="h-3.5 w-3.5" />
              <span className="hidden sm:inline">{isFlagged ? 'Flagged' : 'Flag'}</span>
            </button>
          </div>

          <div className={cx('mt-6 grid gap-2.5', compact && 'sm:grid-cols-2')}>
            {question.options.map((option, i) => (
              <QuestionOption
                key={i}
                option={option}
                index={i}
                state={stateFor(i)}
                onClick={() => selectOption(i)}
                disabled={answered}
              />
            ))}
          </div>

          {!answered && (
            <div className="mt-6 flex flex-wrap items-center justify-between gap-3 border-t border-line/70 pt-4">
              <button
                type="button"
                onClick={skip}
                className="inline-flex items-center gap-1.5 rounded-lg px-2.5 py-1.5 text-xs font-medium text-muted transition hover:bg-line/50 hover:text-ink"
              >
                <Icon name="skip" className="h-3.5 w-3.5" /> Skip for now <Kbd>S</Kbd>
              </button>
              <span className="text-[11px] text-muted">Wrong answers stop for review.</span>
            </div>
          )}

          {answered && (
            <FeedbackPanel
              question={question}
              answer={answer}
              autoLeft={autoLeft}
              autoTotal={prefs.autoAdvance}
              isLast={isLast}
              onNext={advance}
            />
          )}
        </section>

        {isFlagged && <NoteEditor key={question.id} id={question.id} />}

        <div className="mt-5 flex items-center justify-between gap-2">
          <button type="button" disabled={index === 0} onClick={() => goTo(index - 1)} className="inline-flex items-center gap-1.5 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-medium text-ink transition hover:bg-mint/50 disabled:opacity-40">
            <Icon name="arrowLeft" className="h-4 w-4" /> <span className="hidden sm:inline">Previous</span>
          </button>
          <button type="button" onClick={() => setNavOpen(true)} className="inline-flex items-center gap-1.5 rounded-xl border border-forest/40 bg-mint px-4 py-2.5 text-sm font-semibold text-forest transition hover:bg-mintdeep">
            <Icon name="grid" className="h-4 w-4" /> All questions
          </button>
          <button type="button" disabled={isLast} onClick={() => goTo(index + 1)} className="inline-flex items-center gap-1.5 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-medium text-ink transition hover:bg-mint/50 disabled:opacity-40">
            <span className="hidden sm:inline">Next</span> <Icon name="arrowRight" className="h-4 w-4" />
          </button>
        </div>

        <div className="mt-4 flex items-center justify-between gap-3 text-[10px] text-muted">
          <span>{isFlagged ? 'Flagged for review' : '\u00A0'}</span>
          <span>{question.source ? `Source: ${question.source}` : ''}</span>
        </div>
      </main>

      {navOpen && (
        <QuestionNavigator
          ids={ids}
          session={session}
          index={index}
          flags={flags}
          onJump={(i) => { goTo(i); setNavOpen(false); }}
          onClose={() => setNavOpen(false)}
          onFinish={(r) => { setNavOpen(false); onFinish(r); }}
        />
      )}
    </div>
  );
}

          <div className="flex flex-wrap items-center gap-2 text-[11px] text-muted">

              <SubjectIcon subject={question.subject} className="h-3.5 w-3.5" /> {question.subject}
            </span>

                  key={i}

                  )}
                >
                  <span
                    className={cx(
                      'mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded border text-[10px] font-semibold',
                      correct ? 'border-forest bg-forest text-paper' : 'border-line bg-white'

          </button>
        )}

function FlaggedHub({ questions, flags, toggleFlag, session, onPrint, onNavigate }) {
  const [tab, setTab] = useState('flagged');
  const [search, setSearch] = useState('');
  const [subject, setSubject] = useState('all');
  const [showAnswers, setShowAnswers] = useState(true);
  const [selected, setSelected] = useState(new Set());
  const [visible, setVisible] = useState(18);
  const { notes } = React.useContext(AppCtx);

  const flagged = useMemo(() => questions.filter((q) => flags.has(q.id)), [questions, flags]);
  const skipped = useMemo(() => {
    if (!session) return [];
    const answers = session.answers || {};
    const skippedMap = session.skipped || {};
    return questions.filter((q) => skippedMap[q.id] && !answers[q.id]);
  }, [questions, session]);

  const base = tab === 'flagged' ? flagged : skipped;
  const filtered = useMemo(() => {
    const needle = search.trim().toLowerCase();
    return base.filter((q) => {
      if (subject !== 'all' && q.subject !== subject) return false;
      if (!needle) return true;
      const n = notes[q.id];
      return `${q.question} ${q.topic} ${q.options.join(' ')} ${n ? `${n.text} ${(n.tags || []).join(' ')}` : ''}`.toLowerCase().includes(needle);
    });
  }, [base, search, subject, notes]);

  useEffect(() => {
    setVisible(18);
  }, [tab, search, subject]);

  useEffect(() => {
    setSelected(new Set());
  }, [tab]);

  const allVisibleSelected = filtered.length > 0 && filtered.every((q) => selected.has(q.id));

  const toggleSelect = (id) => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (next.has(id)) next.delete(id);
      else next.add(id);
      return next;
    });
  };

  const toggleSelectAll = () => {
    setSelected((prev) => {
      const next = new Set(prev);
      if (allVisibleSelected) filtered.forEach((q) => next.delete(q.id));
      else filtered.forEach((q) => next.add(q.id));
      return next;
    });
  };

  const exportList = (list) => {
    if (!list.length) return;
    const title = tab === 'flagged' ? 'Flagged questions' : 'Skipped questions';
    const subtitle = `${list.length} question${list.length === 1 ? '' : 's'} · ${tab === 'flagged' ? 'Flagged for review' : 'Skipped during a drill'}`;
    onPrint(list, title, subtitle);
  };

  const exportAll = () => exportList(base);
  const exportSelected = () => exportList(base.filter((q) => selected.has(q.id)));

  return (
    <div className="relative z-10 pt-10">
      <div className="flex flex-col justify-between gap-5 md:flex-row md:items-end">
        <div>
          <p className="text-xs font-medium text-forest">Study shelf</p>
          <h1 className="mt-2 font-display text-5xl leading-[0.98] text-ink md:text-6xl">Flagged questions.</h1>
          <p className="mt-2 max-w-xl text-sm leading-relaxed text-muted">
            Keep the tricky ones close. Review them here, then export a clean study sheet for later.
          </p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button
            type="button"
            onClick={exportAll}
            disabled={!base.length}
            className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:border-forest/30 hover:bg-mint/40 disabled:opacity-40"
          >
            <Icon name="print" className="h-4 w-4" /> Export all
          </button>
          <button
            type="button"
            onClick={exportSelected}
            disabled={!selected.size}
            className="inline-flex items-center gap-2 rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper transition hover:bg-forest-dark disabled:opacity-40"
          >
            <Icon name="download" className="h-4 w-4" /> Export selected ({selected.size})
          </button>
        </div>
      </div>

      <div className="mt-6 flex w-fit items-center gap-1 rounded-full border border-line bg-card p-1">
        <button
          type="button"
          onClick={() => setTab('flagged')}
          className={cx('inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-xs font-medium transition', tab === 'flagged' ? 'bg-forest text-paper shadow-sm' : 'text-muted hover:text-ink')}
        >
          Flagged <span className={cx('rounded-full px-1.5 py-0.5 text-[10px]', tab === 'flagged' ? 'bg-white/15' : 'bg-paper')}>{flagged.length}</span>
        </button>
        <button
          type="button"
          onClick={() => setTab('skipped')}
          className={cx('inline-flex items-center gap-2 rounded-full px-4 py-1.5 text-xs font-medium transition', tab === 'skipped' ? 'bg-forest text-paper shadow-sm' : 'text-muted hover:text-ink')}
        >
          Skipped <span className={cx('rounded-full px-1.5 py-0.5 text-[10px]', tab === 'skipped' ? 'bg-white/15' : 'bg-paper')}>{skipped.length}</span>
        </button>
      </div>

      <div className="mt-4 flex flex-col gap-3 rounded-2xl border border-line bg-card p-3 sm:flex-row sm:items-center">
        <div className="relative flex-1">
          <Icon name="search" className="absolute left-3 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" />
          <input
            type="search"
            value={search}
            onChange={(e) => setSearch(e.target.value)}
            placeholder={`Search ${tab === 'flagged' ? 'flagged' : 'skipped'} questions…`}
            className="w-full rounded-xl border border-line bg-paper/60 py-2.5 pl-9 pr-3 text-sm text-ink outline-none transition placeholder:text-muted/70 focus:border-forest/40"
          />
        </div>
        <select
          value={subject}
          onChange={(e) => setSubject(e.target.value)}
          className="rounded-xl border border-line bg-paper/60 px-3 py-2.5 text-sm text-ink outline-none transition focus:border-forest/40"
          aria-label="Filter by subject"
        >
          <option value="all">All subjects</option>
          {SUBJECTS.map((s) => (
            <option key={s.key} value={s.key}>
              {s.short}
            </option>
          ))}
        </select>
        <div className="flex items-center gap-2">
          <button
            type="button"
            onClick={toggleSelectAll}
            disabled={!filtered.length}
            className="rounded-xl border border-line bg-white px-3 py-2 text-xs font-medium text-muted transition hover:border-forest/30 hover:text-ink disabled:opacity-40"
          >
            {allVisibleSelected ? 'Clear selection' : 'Select all'}
          </button>
          <button
            type="button"
            onClick={() => setShowAnswers((v) => !v)}
            className="inline-flex items-center gap-1.5 rounded-xl border border-line bg-white px-3 py-2 text-xs font-medium text-muted transition hover:border-forest/30 hover:text-ink"
          >
            <Icon name={showAnswers ? 'eyeOff' : 'eye'} className="h-3.5 w-3.5" /> {showAnswers ? 'Hide answers' : 'Show answers'}
          </button>
        </div>
      </div>

      <div className="mt-5 space-y-3">
        {filtered.slice(0, visible).map((q) => (
          <FlaggedCard
            key={q.id}
            question={q}
            selected={selected.has(q.id)}
            onSelect={() => toggleSelect(q.id)}
            showAnswers={showAnswers}
            onToggleFlag={toggleFlag}
            tab={tab}
          />
        ))}
      </div>

      {filtered.length > visible && (
        <div className="mt-5 text-center">
          <button
            type="button"
            onClick={() => setVisible((v) => v + 18)}
            className="rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-medium text-ink transition hover:border-forest/30 hover:bg-mint/40"
          >
            Show more ({filtered.length - visible} remaining)
          </button>
        </div>
      )}

      {filtered.length === 0 && (
        <div className="mt-5">
          {tab === 'flagged' ? (
            <EmptyState
              icon="flag"
              title={flagged.length ? 'No matches in this view' : 'No flagged questions yet'}
              description={flagged.length ? 'Try a different search or subject filter.' : 'Tap the flag on any question during a drill to keep it here for later.'}
              action={
                <button type="button" onClick={() => onNavigate('dashboard')} className="inline-flex items-center gap-2 rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper transition hover:bg-forest-dark">
                  Start a drill <Icon name="arrowRight" className="h-4 w-4" />
                </button>
              }
            />
          ) : (
            <EmptyState
              icon="skip"
              title="No skipped questions"
              description="When you skip a question during a drill, it lands here so you can come back to it."
              action={
                <button type="button" onClick={() => onNavigate('dashboard')} className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:bg-mint/40">
                  Back to practice <Icon name="arrowRight" className="h-4 w-4" />
                </button>
              }
            />
          )}
        </div>
      )}

      {selected.size > 0 && (
        <div className="sticky bottom-4 z-20 mt-5 flex items-center justify-between gap-3 rounded-2xl bg-ink px-4 py-3 text-paper shadow-lift">
          <span className="text-sm">
            {selected.size} question{selected.size === 1 ? '' : 's'} selected
          </span>
          <button
            type="button"
            onClick={exportSelected}
            className="inline-flex items-center gap-2 rounded-xl bg-paper px-4 py-2 text-xs font-semibold text-ink transition hover:bg-white"
          >
            <Icon name="download" className="h-3.5 w-3.5" /> Export selected
          </button>
        </div>
      )}
    </div>
  );
}
