function ReviewItem({ question, answer, number, flagged, onToggleFlag }) {
  const [open, setOpen] = useState(false);
  const status = !answer ? 'skipped' : answer.correct ? 'correct' : 'wrong';
  const statusMeta = {
    correct: { icon: 'checkCircle', label: 'Correct', className: 'bg-mint text-forest' },
    wrong: { icon: 'xCircle', label: 'Incorrect', className: 'bg-rose-soft text-rose' },
    skipped: { icon: 'skip', label: 'Skipped', className: 'bg-paper text-muted' }
  }[status];

  return (
    <div className={cx('overflow-hidden rounded-xl border bg-card transition', open ? 'border-forest/25 shadow-sm' : 'border-line')}>
      <button type="button" onClick={() => setOpen((v) => !v)} aria-expanded={open} className="flex w-full items-start gap-3 px-4 py-3.5 text-left">
        <span className={cx('mt-0.5 grid h-6 w-6 shrink-0 place-items-center rounded-full', statusMeta.className)}>
          <Icon name={statusMeta.icon} className="h-3.5 w-3.5" strokeWidth={2.2} />
        </span>
        <span className="min-w-0 flex-1">
          <span className="flex flex-wrap items-center gap-2 text-[10px] text-muted">
            <span className="font-medium text-forest">{question.subject}</span>
            <span>·</span>
            <span className="truncate">{question.topic}</span>
            {answer && answer.timedOut && <span className="rounded-full bg-rose-soft px-1.5 py-0.5 text-[9px] font-medium text-rose">Timed out</span>}
            {flagged && <span className="text-amber">Flagged</span>}
          </span>
          <span className="mt-1 block text-sm font-medium leading-snug text-ink">
            {number}. {question.question}
          </span>
        </span>
        <span className="ml-2 hidden shrink-0 items-center gap-1 text-[10px] font-medium text-muted sm:flex">
          {open ? 'Hide' : 'Review'}
          <Icon name="chevronDown" className={cx('h-3 w-3 transition-transform', open && 'rotate-180')} />
        </span>
      </button>

      {open && (
        <div className="border-t border-line/70 px-4 py-4">
          <div className="grid gap-1.5 sm:grid-cols-2">
            {question.options.map((option, i) => {
              const correct = i === question.correctIndex;
              const selected = answer && answer.selectedIndex === i;
              return (
                <div
                  key={i}
                  className={cx(
                    'flex items-start gap-2 rounded-lg border px-2.5 py-2 text-[13px] leading-relaxed',
                    correct ? 'border-forest/30 bg-mint/70 text-ink' : selected ? 'border-rose/30 bg-rose-soft/70 text-ink' : 'border-line/70 bg-paper/40 text-muted'
                  )}
                >
                  <span
                    className={cx(
                      'mt-0.5 grid h-5 w-5 shrink-0 place-items-center rounded border text-[10px] font-semibold',
                      correct ? 'border-forest bg-forest text-paper' : selected ? 'border-rose bg-rose text-white' : 'border-line bg-white'
                    )}
                  >
                    {correct ? <Icon name="check" className="h-2.5 w-2.5" strokeWidth={3} /> : selected ? <Icon name="x" className="h-2.5 w-2.5" strokeWidth={3} /> : OPTION_LETTERS[i]}
                  </span>
                  <span>{option}</span>
                </div>
              );
            })}
          </div>

          <div className="mt-3 flex flex-wrap items-center gap-2 text-[11px]">
            <span className="rounded-full bg-mint px-2 py-0.5 font-medium text-forest">Correct: {OPTION_LETTERS[question.correctIndex]}</span>
            {answer && !answer.correct && (
              <span className="rounded-full bg-rose-soft px-2 py-0.5 font-medium text-rose">
                Your answer: {answer.selectedIndex != null ? OPTION_LETTERS[answer.selectedIndex] : 'No answer'}
              </span>
            )}
            {status === 'skipped' && <span className="rounded-full bg-paper px-2 py-0.5 font-medium text-muted">Not answered</span>}
          </div>

          <div className="mt-3 rounded-xl bg-paper/70 p-3 text-[13px] leading-relaxed text-muted">
            <span className="font-semibold text-ink">Explanation. </span>
            {question.explanation}
          </div>

          <div className="mt-2 flex items-center justify-between gap-3">
            <span className="text-[10px] text-muted/70">{question.source ? `Source: ${question.source}` : ''}</span>
            <button
              type="button"
              onClick={() => onToggleFlag(question.id)}
              className={cx('inline-flex items-center gap-1.5 rounded-lg px-2 py-1 text-[11px] font-medium transition', flagged ? 'text-amber hover:bg-amber-soft' : 'text-muted hover:bg-paper hover:text-amber')}
            >
              <Icon name="flag" className="h-3.5 w-3.5" /> {flagged ? 'Remove flag' : 'Flag for later'}
            </button>
          </div>
        </div>
      )}
    </div>
  );
}

function Summary({ session, questionsById, flags, toggleFlag, onRetry, onNew, onNavigate }) {
  const stats = getSessionStats(session);
  const sessionQuestions = useMemo(
    () => (session.questionIds || []).map((id) => questionsById[id]).filter(Boolean),
    [questionsById, session.questionIds]
  );

  const wrongIds = useMemo(() => sessionQuestions.filter((q) => session.answers[q.id] && !session.answers[q.id].correct).map((q) => q.id), [session.answers, sessionQuestions]);
  const skippedIds = useMemo(() => sessionQuestions.filter((q) => !session.answers[q.id]).map((q) => q.id), [session.answers, sessionQuestions]);
  const missedIds = useMemo(() => [...wrongIds, ...skippedIds], [skippedIds, wrongIds]);
  const flaggedSession = useMemo(() => sessionQuestions.filter((q) => flags.has(q.id)), [flags, sessionQuestions]);

  const subjectRows = useMemo(() => {
    const map = new Map();
    sessionQuestions.forEach((q) => {
      if (!map.has(q.subject)) map.set(q.subject, { subject: q.subject, total: 0, answered: 0, correct: 0, wrong: 0, skipped: 0 });
      const row = map.get(q.subject);
      row.total += 1;
      const answer = session.answers[q.id];
      if (answer) {
        row.answered += 1;
        if (answer.correct) row.correct += 1;
        else row.wrong += 1;
      } else {
        row.skipped += 1;
      }
    });
    return Array.from(map.values())
      .map((row) => ({ ...row, accuracy: row.answered ? Math.round((row.correct / row.answered) * 100) : 0 }))
      .sort((a, b) => {
        const aUnanswered = a.answered === 0 ? 1 : 0;
        const bUnanswered = b.answered === 0 ? 1 : 0;
        return aUnanswered - bUnanswered || a.accuracy - b.accuracy || b.total - a.total;
      });
  }, [session.answers, sessionQuestions]);

  const topicRows = useMemo(() => {
    const map = new Map();
    sessionQuestions.forEach((q) => {
      const key = `${q.subject}||${q.topic}`;
      if (!map.has(key)) map.set(key, { key, subject: q.subject, topic: q.topic, total: 0, answered: 0, correct: 0, wrong: 0, skipped: 0 });
      const row = map.get(key);
      row.total += 1;
      const answer = session.answers[q.id];
      if (answer) {
        row.answered += 1;
        if (answer.correct) row.correct += 1;
        else row.wrong += 1;
      } else {
        row.skipped += 1;
      }
    });
    return Array.from(map.values())
      .map((row) => ({ ...row, accuracy: row.answered ? Math.round((row.correct / row.answered) * 100) : 0 }))
      .sort((a, b) => {
        const aUnanswered = a.answered === 0 ? 1 : 0;
        const bUnanswered = b.answered === 0 ? 1 : 0;
        return aUnanswered - bUnanswered || a.accuracy - b.accuracy || b.answered - a.answered;
      });
  }, [session.answers, sessionQuestions]);

  const weakTopics = topicRows.filter((row) => row.answered > 0 && row.accuracy < 70).slice(0, 3);

  const [reviewFilter, setReviewFilter] = useState('all');
  const [showAllTopics, setShowAllTopics] = useState(false);
  const [visibleReview, setVisibleReview] = useState(12);

  useEffect(() => {
    setVisibleReview(12);
  }, [reviewFilter]);

  const filters = [
    { key: 'all', label: 'All', count: sessionQuestions.length },
    { key: 'wrong', label: 'Incorrect', count: wrongIds.length },
    { key: 'skipped', label: 'Skipped', count: skippedIds.length },
    { key: 'flagged', label: 'Flagged', count: flaggedSession.length }
  ];

  const reviewItems = sessionQuestions.filter((q) => {
    const answer = session.answers[q.id];
    if (reviewFilter === 'wrong') return answer && !answer.correct;
    if (reviewFilter === 'skipped') return !answer;
    if (reviewFilter === 'flagged') return flags.has(q.id);
    return true;
  });

  const accuracyClass = (value) => (value >= 70 ? 'text-forest' : value >= 40 ? 'text-amber' : 'text-rose');

  return (
    <div className="relative z-10 pt-10">
      <div className="flex flex-col justify-between gap-5 md:flex-row md:items-end">
        <div>
          <p className="text-xs font-medium text-forest">
            Drill complete · {new Date(session.finishedAt || Date.now()).toLocaleDateString(undefined, { month: 'short', day: 'numeric' })}
          </p>
          <h1 className="mt-2 font-display text-5xl leading-[0.98] text-ink md:text-6xl">A clear read on where you stand.</h1>
          <p className="mt-2 text-sm text-muted">
            {stats.total} questions · {formatClock(stats.elapsed)} elapsed · {session.config && session.config.mode === 'timed' ? 'Timed drill' : 'Relaxed practice'}
          </p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button
            type="button"
            onClick={() => onRetry(missedIds)}
            disabled={!missedIds.length}
            className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:border-forest/30 hover:bg-mint/40 disabled:opacity-40"
          >
            <Icon name="rotate" className="h-4 w-4" /> Retry missed ({missedIds.length})
          </button>
          <button
            type="button"
            onClick={() => onNavigate('flagged')}
            className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:border-amber/30 hover:bg-amber-soft disabled:opacity-40"
          >
            <Icon name="flag" className="h-4 w-4" /> Flagged ({flaggedSession.length})
          </button>
          <button
            type="button"
            onClick={onNew}
            className="inline-flex items-center gap-2 rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper transition hover:bg-forest-dark"
          >
            <Icon name="plus" className="h-4 w-4" /> New drill
          </button>
        </div>
      </div>

      <div className="mt-8 grid gap-4 lg:grid-cols-[1.05fr_.95fr]">
        <div className="rounded-[28px] border border-line bg-card p-6 shadow-card md:p-8">
          <div className="flex flex-col items-center gap-6 sm:flex-row">
            <AccuracyRing value={stats.accuracy} />
            <div className="min-w-0 text-center sm:text-left">
              <div className="text-xs font-medium text-forest">Your result</div>
              <div className="mt-1 font-display text-4xl leading-none text-ink">
                {stats.correct} <span className="text-2xl text-muted">/ {stats.total}</span>
              </div>
              <p className="mt-2 text-sm text-muted">correct answers</p>
              <div className="mt-4 flex flex-wrap justify-center gap-2 sm:justify-start">
                <span className="rounded-full bg-mint px-3 py-1 text-xs font-medium text-forest">{stats.answered} attempted</span>
                <span className="rounded-full bg-rose-soft px-3 py-1 text-xs font-medium text-rose">{stats.wrong} incorrect</span>
                <span className="rounded-full bg-paper px-3 py-1 text-xs font-medium text-muted">{stats.skipped} skipped</span>
              </div>
            </div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-3">
          <StatCard label="Accuracy" value={`${stats.accuracy}%`} sub="of attempted" icon="target" tone="forest" />
          <StatCard label="Time" value={formatClock(stats.elapsed)} sub="elapsed" icon="clock" />
          <StatCard label="Flagged" value={flaggedSession.length} sub="in this drill" icon="flag" tone="amber" />
          <StatCard label="Completion" value={`${stats.completion}%`} sub={`${stats.answered}/${stats.total}`} icon="checkCircle" />
        </div>
      </div>

      {stats.answered === 0 ? (
        <section className="mt-6 flex items-center gap-3 rounded-2xl border border-line bg-card p-5">
          <div className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-paper text-muted">
            <Icon name="info" className="h-4 w-4" />
          </div>
          <div>
            <h2 className="text-sm font-semibold text-ink">No questions attempted</h2>
            <p className="text-xs text-muted">This drill ended before an answer was recorded. Start a fresh one when you’re ready.</p>
          </div>
        </section>
      ) : weakTopics.length > 0 ? (
        <section className="mt-6 rounded-2xl border border-amber/20 bg-amber-soft/50 p-5">
          <div className="flex items-center gap-2">
            <Icon name="target" className="h-4 w-4 text-amber" />
            <h2 className="text-sm font-semibold text-ink">Focus next on</h2>
          </div>
          <div className="mt-3 grid gap-2 sm:grid-cols-3">
            {weakTopics.map((topic) => (
              <div key={topic.key} className="rounded-xl border border-amber/15 bg-card/80 p-3">
                <div className="text-[10px] text-muted">{topic.subject}</div>
                <div className="mt-1 text-sm font-medium leading-snug text-ink">{topic.topic}</div>
                <div className="mt-1 text-xs font-medium text-amber">
                  {topic.accuracy}% · {topic.correct}/{topic.answered}
                </div>
              </div>
            ))}
          </div>
        </section>
      ) : (
        <section className="mt-6 flex items-center gap-3 rounded-2xl border border-forest/15 bg-mint/50 p-5">
          <div className="grid h-9 w-9 shrink-0 place-items-center rounded-full bg-forest text-paper">
            <Icon name="spark" className="h-4 w-4" />
          </div>
          <div>
            <h2 className="text-sm font-semibold text-ink">No weak areas in this drill.</h2>
            <p className="text-xs text-muted">Every topic you attempted landed at 70% or above.</p>
          </div>
        </section>
      )}

      <section className="mt-10">
        <SectionHeading eyebrow="By subject" title="Where the marks came from" description="Accuracy is calculated from the questions you answered." />
        <div className="mt-4 overflow-hidden rounded-2xl border border-line bg-card">
          <div className="hidden grid-cols-[1.4fr_.7fr_.5fr_1fr] gap-4 border-b border-line px-4 py-3 text-[10px] font-medium text-muted sm:grid">
            <span>Subject</span>
            <span>Correct</span>
            <span>Accuracy</span>
            <span>Distribution</span>
          </div>
          {subjectRows.map((row) => (
            <div key={row.subject} className="grid gap-3 border-b border-line px-4 py-4 last:border-0 sm:grid-cols-[1.4fr_.7fr_.5fr_1fr] sm:items-center sm:gap-4">
              <div className="flex items-center gap-2.5">
                <span className="grid h-8 w-8 shrink-0 place-items-center rounded-lg bg-mint text-forest">
                  <SubjectIcon subject={row.subject} className="h-4 w-4" />
                </span>
                <div>
                  <div className="text-sm font-medium text-ink">{SUBJECT_MAP[row.subject] ? SUBJECT_MAP[row.subject].short : row.subject}</div>
                  <div className="text-[10px] text-muted">{row.total} questions</div>
                </div>
              </div>
              <div className="text-xs text-muted">
                {row.answered ? (
                  <>
                    <span className="font-medium text-ink">{row.correct}</span> / {row.answered} correct
                  </>
                ) : (
                  'Not attempted'
                )}
              </div>
              <div className={cx('text-sm font-semibold', row.answered ? accuracyClass(row.accuracy) : 'text-muted')}>{row.answered ? `${row.accuracy}%` : '—'}</div>
              <div>
                <BreakdownBar correct={row.correct} wrong={row.wrong} total={row.total} />
                <div className="mt-1 text-[10px] text-muted">{row.skipped} skipped</div>
              </div>
            </div>
          ))}
        </div>
      </section>

      <section className="mt-10">
        <SectionHeading
          eyebrow="By topic"
          title="The fine-grained picture"
          description="Weakest topics appear first."
          right={
            topicRows.length > 8 ? (
              <button
                type="button"
                onClick={() => setShowAllTopics((v) => !v)}
                className="rounded-lg px-2.5 py-1.5 text-xs font-medium text-forest transition hover:bg-mint/60"
              >
                {showAllTopics ? 'Show fewer' : `Show all ${topicRows.length} topics`}
              </button>
            ) : null
          }
        />
        <div className="mt-4 grid gap-2.5 sm:grid-cols-2">
          {(showAllTopics ? topicRows : topicRows.slice(0, 8)).map((row) => (
            <div key={row.key} className="rounded-xl border border-line bg-card p-3.5">
              <div className="flex items-start justify-between gap-3">
                <div className="min-w-0">
                  <div className="text-[10px] text-muted">{SUBJECT_MAP[row.subject] ? SUBJECT_MAP[row.subject].short : row.subject}</div>
                  <div className="truncate text-sm font-medium text-ink" title={row.topic}>
                    {row.topic}
                  </div>
                </div>
                <span className={cx('shrink-0 text-sm font-semibold', row.answered ? accuracyClass(row.accuracy) : 'text-muted')}>{row.answered ? `${row.accuracy}%` : '—'}</span>
              </div>
              <div className="mt-2">
                <BreakdownBar correct={row.correct} wrong={row.wrong} total={row.total} />
              </div>
              <div className="mt-1.5 text-[10px] text-muted">
                {row.answered ? `${row.correct}/${row.answered} correct · ${row.skipped} skipped` : `Not attempted · ${row.skipped} skipped`}
              </div>
            </div>
          ))}
        </div>
      </section>

      <section className="mt-10">
        <SectionHeading eyebrow="Review" title="Go back through the drill" description="Expand any question to see the answer and explanation." />

        <div className="mt-4 flex flex-wrap gap-1.5">
          {filters.map((filter) => (
            <button
              key={filter.key}
              type="button"
              onClick={() => setReviewFilter(filter.key)}
              className={cx(
                'inline-flex items-center gap-1.5 rounded-full border px-3 py-1.5 text-xs font-medium transition',
                reviewFilter === filter.key ? 'border-forest bg-forest text-paper' : 'border-line bg-card text-muted hover:border-forest/30 hover:text-ink'
              )}
            >
              {filter.label}
              <span className={cx('rounded-full px-1.5 py-0.5 text-[10px]', reviewFilter === filter.key ? 'bg-white/15' : 'bg-paper')}>{filter.count}</span>
            </button>
          ))}
        </div>

        <div className="mt-4 space-y-2.5">
          {reviewItems.slice(0, visibleReview).map((q) => (
            <ReviewItem
              key={q.id}
              question={q}
              answer={session.answers[q.id] || null}
              number={session.questionIds.indexOf(q.id) + 1}
              flagged={flags.has(q.id)}
              onToggleFlag={toggleFlag}
            />
          ))}
        </div>

        {reviewItems.length > visibleReview && (
          <div className="mt-5 text-center">
            <button
              type="button"
              onClick={() => setVisibleReview((v) => v + 15)}
              className="rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-medium text-ink transition hover:border-forest/30 hover:bg-mint/40"
            >
              Show more ({reviewItems.length - visibleReview} remaining)
            </button>
          </div>
        )}

        {reviewItems.length === 0 && (
          <div className="mt-4">
            <EmptyState icon="checkCircle" title="Nothing in this filter" description="Try another view to keep reviewing the drill." />
          </div>
        )}
      </section>
    </div>
  );
}

class ErrorBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { err: null };
  }
  static getDerivedStateFromError(err) {
    return { err };
  }
  render() {
    if (!this.state.err) return this.props.children;
    const reset = () => {
      removeStorage(STORAGE.session);
      window.location.reload();
    };
    return (
      <div className="grid min-h-screen place-items-center bg-paper px-6">
        <div className="max-w-md text-center">
          <h1 className="font-display text-4xl text-ink">Something went wrong.</h1>
          <p className="mt-2 text-sm leading-relaxed text-muted">The app hit an unexpected error. Your history and notes are safe. If it keeps happening, clear the current session.</p>
          <pre className="mt-4 overflow-auto rounded-xl bg-ink p-3 text-left font-mono text-[11px] text-paper/80">{String((this.state.err && this.state.err.message) || this.state.err)}</pre>
          <div className="mt-5 flex justify-center gap-2">
            <button type="button" onClick={() => window.location.reload()} className="rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper">Reload</button>
            <button type="button" onClick={reset} className="rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink">Clear session &amp; reload</button>
          </div>
        </div>
      </div>
    );
  }
}

let HEALTH_DISMISSED = false;
function DataHealth({ info }) {
  const [hidden, setHidden] = useState(HEALTH_DISMISSED);
  const [open, setOpen] = useState(false);
  const failed = (info && info.failed) || [];
  const dropped = (info && info.dropped) || [];
  if (hidden || (!failed.length && !dropped.length)) return null;
  return (
    <div role="alert" className="mt-5 rounded-2xl border border-amber/50 bg-amber-soft p-4 text-sm text-ink">
      <div className="flex items-start gap-3">
        <Icon name="alert" className="mt-0.5 h-5 w-5 shrink-0 text-amber" />
        <div className="min-w-0 flex-1">
          <p className="font-semibold">Some data was skipped while loading.</p>
          <p className="mt-0.5 text-xs text-muted">
            {failed.length} file{failed.length === 1 ? '' : 's'} unreadable · {dropped.length} question{dropped.length === 1 ? '' : 's'} rejected
            {info.duplicates ? ` · ${info.duplicates} duplicate${info.duplicates === 1 ? '' : 's'} merged` : ''}
          </p>
          <button type="button" onClick={() => setOpen(!open)} className="mt-2 text-xs font-semibold text-forest underline">{open ? 'Hide details' : 'Show details'}</button>
          {open && (
            <ul className="mt-2 max-h-56 space-y-1 overflow-auto rounded-lg border border-line bg-card p-3 font-mono text-[11px] leading-relaxed text-muted">
              {failed.map((f, i) => <li key={`f${i}`}><span className="text-rose">FILE</span> {f.file} — {f.message}</li>)}
              {dropped.slice(0, 60).map((d, i) => (
                <li key={`d${i}`}><span className="text-amber">#{d.index + 1}</span> {String(d.file).split('/').pop()}: {d.reason}{d.preview ? ` — “${d.preview}”` : ''}</li>
              ))}
              {dropped.length > 60 && <li>…and {dropped.length - 60} more.</li>}

          <Icon name="x" className="h-4 w-4" />
        </button>
      </div>
    </div>
  );
}

/* ---------- Notes & tags on flagged questions ---------- */

const NOTE_TAGS = ['Concept gap', 'Careless slip', 'Memorise', 'Guessed', 'Revisit'];

function NoteEditor({ id }) {
  const { notes, setNote } = React.useContext(AppCtx);
  const entry = notes[id] || { text: '', tags: [] };
  const tags = entry.tags || [];
  const [open, setOpen] = useState(!!(entry.text || tags.length));
  const [text, setText] = useState(entry.text || '');
  const textRef = useRef(text);
  const dirty = useRef(false);
  textRef.current = text;

  useEffect(() => {
    if (!dirty.current) return undefined;
    const t = setTimeout(() => {
      setNote(id, { text });
      dirty.current = false;
    }, 350);
    return () => clearTimeout(t);
  }, [text, id, setNote]);

  useEffect(
    () => () => {
      if (dirty.current) setNote(id, { text: textRef.current });
    },
    [id, setNote]
  );

  const toggleTag = (tag) => setNote(id, { tags: tags.includes(tag) ? tags.filter((t) => t !== tag) : [...tags, tag] });

  if (!open) {
    return (
      <button type="button" onClick={() => setOpen(true)} className="mt-4 inline-flex items-center gap-1.5 rounded-lg border border-dashed border-line px-3 py-2 text-xs font-medium text-muted transition hover:border-amber hover:text-amber">
        <Icon name="edit" className="h-3.5 w-3.5" /> Add note or tag
      </button>
    );
  }
  return (
    <div className="mt-4 rounded-xl border border-amber/40 bg-amber-soft/70 p-3">
      <div className="flex flex-wrap gap-1.5" role="group" aria-label="Tags">
        {NOTE_TAGS.map((tag) => (
          <ChoiceChip key={tag} tone="clay" active={tags.includes(tag)} onClick={() => toggleTag(tag)}>{tag}</ChoiceChip>
        ))}
      </div>
      <textarea
        value={text}
        onChange={(e) => {
          dirty.current = true;
          setText(e.target.value);
        }}
        maxLength={500}
        rows={2}
        aria-label="Personal note"
        placeholder="Why did this trip you up? What will you remember next time?"
        className="mt-2 w-full resize-y rounded-lg border border-line bg-white px-3 py-2 text-base text-ink placeholder:text-muted focus:border-forest focus:outline-none sm:text-sm"
      />
    </div>
  );
}

/* ---------- Question navigator (jump grid) ---------- */

const NAV_TONES = {
  correct: 'border-forest bg-mint text-forest',
  wrong: 'border-rose bg-rose-soft text-rose',
  timeout: 'border-dashed border-rose bg-rose-soft text-rose',
  skipped: 'border-amber bg-amber-soft text-amber',
  open: 'border-line bg-card text-ink hover:border-forest/60'
};

function QuestionNavigator({ ids, session, index, flags, onJump, onClose, onFinish }) {
  const [filter, setFilter] = useState('all');
  const [confirmFinish, setConfirmFinish] = useState(false);

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === 'Escape' || e.key.toLowerCase() === 'g') {
        e.preventDefault();
        onClose();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, [onClose]);

  const items = ids.map((id, i) => {
    const a = session.answers[id];
    const status = a ? (a.timedOut ? 'timeout' : a.correct ? 'correct' : 'wrong') : session.skipped && session.skipped[id] ? 'skipped' : 'open';
    return { id, i, status, flagged: flags.has(id) };
  });
  const isOpen = (x) => x.status === 'open' || x.status === 'skipped';
  const unanswered = items.filter(isOpen).length;
  const answered = items.length - unanswered;
  const nextOpen = items.find((x) => x.i > index && isOpen(x)) || items.find(isOpen);
  const shown = items.filter((x) => (filter === 'all' ? true : filter === 'unanswered' ? isOpen(x) : filter === 'skipped' ? x.status === 'skipped' : x.flagged));
  const nSkipped = items.filter((x) => x.status === 'skipped').length;
  const nFlagged = items.filter((x) => x.flagged).length;

  return (
    <div className="fixed inset-0 z-50" role="dialog" aria-modal="true" aria-label="Question navigator">
      <div className="absolute inset-0 animate-fade-up bg-black/55" onClick={onClose} />
      <div className="absolute inset-x-0 bottom-0 flex max-h-[88vh] animate-pop flex-col rounded-t-[28px] border border-line bg-card shadow-lift sm:inset-y-0 sm:left-auto sm:right-0 sm:max-h-none sm:w-[420px] sm:rounded-l-[28px] sm:rounded-tr-none">
        <div className="flex items-center justify-between gap-3 border-b border-line px-5 py-4">
          <div>
            <h2 className="font-display text-2xl leading-tight text-ink">Jump to question</h2>
            <p className="text-xs text-muted">{answered} of {items.length} answered · press <Kbd>G</Kbd> to toggle</p>
          </div>
          <div className="flex items-center gap-2">
            <ThemeToggle />
            <button type="button" onClick={onClose} aria-label="Close navigator" className="grid h-10 w-10 place-items-center rounded-full border border-line bg-card text-ink hover:bg-mint">
              <Icon name="x" className="h-4 w-4" />
            </button>
          </div>
        </div>

        <div className="flex-1 overflow-y-auto px-5 py-4">
          <div className="flex flex-wrap gap-1.5">
            <ChoiceChip active={filter === 'all'} onClick={() => setFilter('all')}>All</ChoiceChip>
            <ChoiceChip active={filter === 'unanswered'} onClick={() => setFilter('unanswered')}>Unanswered ({unanswered})</ChoiceChip>
            <ChoiceChip active={filter === 'skipped'} onClick={() => setFilter('skipped')}>Skipped ({nSkipped})</ChoiceChip>
            <ChoiceChip active={filter === 'flagged'} onClick={() => setFilter('flagged')}>Flagged ({nFlagged})</ChoiceChip>
          </div>

          <div className="mt-4 grid grid-cols-[repeat(auto-fill,minmax(46px,1fr))] gap-2">
            {shown.map((x) => (
              <button
                key={x.id}
                type="button"
                onClick={() => onJump(x.i)}
                aria-label={`Question ${x.i + 1}: ${x.status === 'open' ? 'unanswered' : x.status}${x.flagged ? ', flagged' : ''}`}
                aria-current={x.i === index ? 'true' : undefined}
                className={cx(
                  'relative h-11 min-w-[46px] rounded-xl border text-sm font-semibold tabular transition',
                  NAV_TONES[x.status],
                  x.i === index && 'ring-2 ring-forest ring-offset-2 ring-offset-card'
                )}
              >
                {x.i + 1}
                {x.status === 'correct' && <Icon name="check" className="absolute bottom-0.5 right-0.5 h-2.5 w-2.5" strokeWidth={3} />}
                {(x.status === 'wrong' || x.status === 'timeout') && <Icon name="x" className="absolute bottom-0.5 right-0.5 h-2.5 w-2.5" strokeWidth={3} />}
                {x.flagged && <span className="absolute -right-1 -top-1 h-3 w-3 rounded-full border-2 border-card bg-amber" />}
              </button>
            ))}
          </div>
          {!shown.length && <p className="mt-6 text-center text-sm text-muted">Nothing matches this filter.</p>}

          <div className="mt-5 flex flex-wrap gap-x-4 gap-y-1.5 text-[11px] text-muted">
            <span><b className="text-forest">✓</b> correct</span>
            <span><b className="text-rose">✕</b> wrong</span>
            <span><b className="text-amber">▢</b> skipped</span>
            <span>▢ unanswered</span>
            <span><b className="text-amber">●</b> flagged</span>
          </div>
        </div>

        <div className="space-y-2 border-t border-line px-5 py-4 pb-[max(1rem,env(safe-area-inset-bottom))]">
          {nextOpen && (
            <button type="button" onClick={() => onJump(nextOpen.i)} className="flex w-full items-center justify-center gap-2 rounded-xl border border-line bg-card px-4 py-3 text-sm font-semibold text-ink transition hover:bg-mint/50">
              Go to next unanswered ({nextOpen.i + 1}) <Icon name="arrowRight" className="h-4 w-4" />
            </button>
          )}
          {!confirmFinish ? (
            <button type="button" onClick={() => (unanswered > 0 ? setConfirmFinish(true) : onFinish('complete'))} className="flex w-full items-center justify-center gap-2 rounded-xl bg-forest px-4 py-3 text-sm font-semibold text-paper transition hover:bg-forest-dark">
              {unanswered > 0 ? `Finish with ${unanswered} unanswered` : 'Finish & see results'}
            </button>
          ) : (
            <div className="rounded-xl border border-amber/40 bg-amber-soft p-3">
              <p className="text-xs text-ink">{unanswered} question{unanswered === 1 ? ' is' : 's are'} still unanswered. They will count as skipped.</p>
              <div className="mt-2 flex gap-2">
                <button type="button" onClick={() => setConfirmFinish(false)} className="flex-1 rounded-lg border border-line bg-card px-3 py-2.5 text-xs font-semibold text-ink">Keep practising</button>
                <button type="button" onClick={() => onFinish('complete')} className="flex-1 rounded-lg bg-forest px-3 py-2.5 text-xs font-semibold text-paper">Finish anyway</button>
              </div>
            </div>
          )}
        </div>
      </div>
    </div>
  );
}

function QuestionBank({ questions, flags, toggleFlag, qStats }) {
  const { notes } = React.useContext(AppCtx);
  const [search, setSearch] = useState('');
  const deferred = React.useDeferredValue(search);
  const [subject, setSubject] = useState('all');
  const [topic, setTopic] = useState('all');
  const [scope, setScope] = useState('all');
  const [showAll, setShowAll] = useState(false);
  const [open, setOpen] = useState({});
  const [visible, setVisible] = useState(25);
  const searchRef = useRef(null);

  const topics = useMemo(() => {
    const set = new Set();
    questions.forEach((q) => {
      if (subject === 'all' || q.subject === subject) set.add(q.topic);
    });
    return Array.from(set).sort((a, b) => a.localeCompare(b));
  }, [questions, subject]);

  useEffect(() => setTopic('all'), [subject]);
  useEffect(() => setVisible(25), [deferred, subject, topic, scope]);
  useEffect(() => {
    const onKey = (e) => {
      const tag = (document.activeElement && document.activeElement.tagName) || '';
      if (e.key === '/' && !/INPUT|TEXTAREA|SELECT/.test(tag)) {
        e.preventDefault();
        if (searchRef.current) searchRef.current.focus();
      }
    };
    window.addEventListener('keydown', onKey);
    return () => window.removeEventListener('keydown', onKey);
  }, []);

  const filtered = useMemo(() => {
    const needle = deferred.trim().toLowerCase();
    return questions.filter((q) => {
      if (subject !== 'all' && q.subject !== subject) return false;
      if (topic !== 'all' && q.topic !== topic) return false;
      const st = qStats[q.id];
      if (scope === 'flagged' && !flags.has(q.id)) return false;
      if (scope === 'missed' && !(st && st.wrong > 0)) return false;
      if (scope === 'new' && st) return false;
      if (!needle) return true;
      const n = notes[q.id];
      const hay = `${q.question} ${q.topic} ${q.options.join(' ')} ${n ? `${n.text} ${(n.tags || []).join(' ')}` : ''}`;
      return hay.toLowerCase().includes(needle);
    });
  }, [questions, deferred, subject, topic, scope, qStats, flags, notes]);

  const toggleOpen = useCallback((id) => setOpen((p) => ({ ...p, [id]: !p[id] })), []);

  return (
    <div className="relative z-10 pt-10">
      <p className="text-xs font-medium text-forest">Study freely</p>
      <h1 className="mt-2 font-display text-5xl leading-[0.98] text-ink md:text-6xl">Question bank.</h1>
      <p className="mt-2 max-w-xl text-sm leading-relaxed text-muted">Search every question, filter by subject and topic, and read answers on demand. No timer, no pressure.</p>

      <div className="sticky top-[72px] z-20 -mx-5 mt-6 border-y border-line bg-paper/95 px-5 py-3 backdrop-blur-xl md:top-[72px]">
        <div className="flex flex-col gap-2 md:flex-row">
          <label className="relative block flex-1">
            <span className="sr-only">Search questions</span>
            <Icon name="search" className="pointer-events-none absolute left-3.5 top-1/2 h-4 w-4 -translate-y-1/2 text-muted" />
            <input
              ref={searchRef}
              type="search"
              value={search}
              onChange={(e) => setSearch(e.target.value)}
              placeholder="Search questions, options, topics, notes…  ( / )"
              className="h-12 w-full rounded-xl border border-line bg-card pl-10 pr-3 text-base text-ink placeholder:text-muted focus:border-forest focus:outline-none sm:text-sm"
            />
          </label>
          <select value={topic} onChange={(e) => setTopic(e.target.value)} aria-label="Filter by topic" className="h-12 rounded-xl border border-line bg-card px-3 text-base text-ink focus:border-forest focus:outline-none sm:text-sm md:w-56">
            <option value="all">All topics ({topics.length})</option>
            {topics.map((t) => <option key={t} value={t}>{t}</option>)}
          </select>
        </div>
        <div className="mt-2 flex gap-1.5 overflow-x-auto pb-1">
          <ChoiceChip active={subject === 'all'} onClick={() => setSubject('all')}>All subjects</ChoiceChip>
          {SUBJECTS.map((s) => <ChoiceChip key={s.key} active={subject === s.key} onClick={() => setSubject(s.key)}>{s.short}</ChoiceChip>)}
        </div>
        <div className="mt-1 flex flex-wrap items-center gap-1.5">
          {[['all', 'Everything'], ['flagged', 'Flagged'], ['missed', 'Missed before'], ['new', 'Not attempted']].map(([k, label]) => (
            <ChoiceChip key={k} tone="clay" active={scope === k} onClick={() => setScope(k)}>{label}</ChoiceChip>
          ))}
          <span className="ml-auto flex items-center gap-2 text-xs text-muted">
            Show all answers <Toggle checked={showAll} onChange={() => setShowAll(!showAll)} label="Show all answers" />
          </span>
        </div>
      </div>

      <p className="mt-4 text-xs text-muted" aria-live="polite">Showing {formatCount(Math.min(visible, filtered.length))} of {formatCount(filtered.length)} questions</p>

      <div className="mt-3 grid gap-3">
        {filtered.slice(0, visible).map((q) => (
          <BankCard key={q.id} q={q} stat={qStats[q.id]} flagged={flags.has(q.id)} revealed={showAll || !!open[q.id]} toggleFlag={toggleFlag} toggleOpen={toggleOpen} />
        ))}
      </div>

      {!filtered.length && <div className="mt-4"><EmptyState icon="search" title="No questions match." description="Try a different search, or clear the subject, topic and status filters." /></div>}
      {visible < filtered.length && (
        <div className="mt-5 text-center">
          <button type="button" onClick={() => setVisible((v) => v + 25)} className="rounded-xl border border-line bg-card px-5 py-3 text-sm font-semibold text-ink transition hover:bg-mint/50">
            Show 25 more
          </button>
        </div>
      )}
    </div>
  );
}

/* ---------- Progress & history ---------- */

function TrendChart({ points }) {
  const W = 640, H = 200, L = 34, R = 12, T = 12, B = 28;
  const n = points.length;
  const x = (i) => L + (n < 2 ? (W - L - R) / 2 : (i * (W - L - R)) / (n - 1));
  const y = (v) => T + (1 - v / 100) * (H - T - B);
  const d = points.map((p, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(p.acc).toFixed(1)}`).join(' ');
  const fmt = (ts) => new Date(ts).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  return (
    <svg viewBox={`0 0 ${W} ${H}`} className="w-full text-forest" role="img" aria-label={`Accuracy over your last ${n} sessions`}>
      {[0, 50, 100].map((g) => (
        <g key={g}>
          <line x1={L} x2={W - R} y1={y(g)} y2={y(g)} stroke="currentColor" className="text-line" strokeDasharray={g === 50 ? '3 4' : undefined} />
          <text x={L - 6} y={y(g) + 3} textAnchor="end" fontSize="10" fill="currentColor" className="text-muted">{g}%</text>
        </g>
      ))}
      <path d={d} fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinejoin="round" strokeLinecap="round" />
      {points.map((p, i) => <circle key={i} cx={x(i)} cy={y(p.acc)} r="4" fill="currentColor" className="text-forest"><title>{`${fmt(p.ts)}: ${p.acc}%`}</title></circle>)}
      <text x={L} y={H - 8} fontSize="10" fill="currentColor" className="text-muted">{fmt(points[0].ts)}</text>
      <text x={W - R} y={H - 8} textAnchor="end" fontSize="10" fill="currentColor" className="text-muted">{fmt(points[n - 1].ts)}</text>
    </svg>
  );
}

function HistoryView({ history, onDelete, onClear, onExport, onImport, onNavigate }) {
  const [visible, setVisible] = useState(12);
  const fileRef = useRef(null);
  const D = 864e5;
  const now = Date.now();

  const s = useMemo(() => {
    let answered = 0, correct = 0, elapsed = 0;
    const subj = {};
    const days = {};
    history.forEach((r) => {
      answered += r.answered;
      correct += r.correct;
      elapsed += r.elapsed || 0;
      Object.entries(r.bySubject || {}).forEach(([k, v]) => {
        const b = subj[k] || (subj[k] = { a: 0, c: 0 });
        b.a += v.a;
        b.c += v.c;
      });
      const dk = new Date(r.finishedAt).toDateString();
      days[dk] = (days[dk] || 0) + r.answered;
    });
    const agg = (from, to) => {
      let a = 0, c = 0;
      history.forEach((r) => {
        if (r.finishedAt >= from && r.finishedAt < to) {
          a += r.answered;
          c += r.correct;
        }
      });
      return a ? Math.round((c / a) * 100) : null;
    };
    let streak = 0;
    let cursor = new Date();
    if (!days[cursor.toDateString()]) cursor = new Date(now - D);
    while (days[cursor.toDateString()]) {
      streak += 1;
      cursor = new Date(cursor.getTime() - D);
    }
    const last14 = Array.from({ length: 14 }, (_, i) => {
      const dt = new Date(now - (13 - i) * D);
      return { label: dt.toLocaleDateString(undefined, { weekday: 'narrow' }), n: days[dt.toDateString()] || 0, title: dt.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }) };
    });
    const cur = agg(now - 7 * D, now + 1);
    const prev = agg(now - 14 * D, now - 7 * D);
    return { answered, correct, elapsed, subj, streak, last14, cur, prev, acc: answered ? Math.round((correct / answered) * 100) : 0 };
  }, [history, now]);

  const trend = history.slice(0, 20).reverse().map((r) => ({ acc: r.accuracy, ts: r.finishedAt }));
  const maxDay = Math.max(1, ...s.last14.map((d) => d.n));
  const delta = s.cur != null && s.prev != null ? s.cur - s.prev : null;

  return (
    <div className="relative z-10 pt-10">
      <div className="flex flex-col justify-between gap-5 md:flex-row md:items-end">
        <div>
          <p className="text-xs font-medium text-forest">Over time</p>
          <h1 className="mt-2 font-display text-5xl leading-[0.98] text-ink md:text-6xl">Your progress.</h1>
          <p className="mt-2 max-w-xl text-sm leading-relaxed text-muted">Every finished drill is saved in this browser. Download a backup now and then, since clearing site data erases it.</p>
        </div>
        <div className="flex flex-wrap gap-2">
          <button type="button" onClick={onExport} className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:bg-mint/50">
            <Icon name="download" className="h-4 w-4" /> Backup
          </button>
          <button type="button" onClick={() => fileRef.current && fileRef.current.click()} className="inline-flex items-center gap-2 rounded-xl border border-line bg-card px-4 py-2.5 text-sm font-semibold text-ink transition hover:bg-mint/50">
            <Icon name="upload" className="h-4 w-4" /> Restore
          </button>
          <input ref={fileRef} type="file" accept=".json,application/json" className="hidden" onChange={(e) => { if (e.target.files[0]) onImport(e.target.files[0]); e.target.value = ''; }} />
        </div>
      </div>

      {!history.length ? (
        <div className="mt-8">
          <EmptyState icon="chart" title="No finished drills yet." description="Complete a practice session and your accuracy, pace and subject strengths will build up here." action={<button type="button" onClick={() => onNavigate('dashboard')} className="rounded-xl bg-forest px-4 py-2.5 text-sm font-semibold text-paper">Start practising</button>} />
        </div>
      ) : (
        <>
          <div className="mt-8 grid grid-cols-2 gap-3 md:grid-cols-4">
            <StatCard label="Sessions" value={history.length} sub={`${formatCount(s.answered)} questions answered`} icon="layers" />
            <StatCard label="Overall accuracy" value={`${s.acc}%`} sub={delta == null ? 'Need two weeks of data for a trend' : `${delta >= 0 ? '▲' : '▼'} ${Math.abs(delta)} pts vs previous 7 days`} icon="target" tone="forest" />
            <StatCard label="Study streak" value={`${s.streak}d`} sub="Consecutive days practised" icon="bolt" tone="amber" />
            <StatCard label="Time studied" value={formatMinutes(s.elapsed)} sub="Across all sessions" icon="clock" />
          </div>

          <div className="mt-4 grid gap-4 lg:grid-cols-5">
            <section className="rounded-2xl border border-line bg-card p-5 lg:col-span-3">
              <h2 className="font-display text-2xl text-ink">Accuracy trend</h2>
              <p className="mb-2 text-xs text-muted">Last {trend.length} session{trend.length === 1 ? '' : 's'}</p>
              <TrendChart points={trend} />
            </section>
            <section className="rounded-2xl border border-line bg-card p-5 lg:col-span-2">
              <h2 className="font-display text-2xl text-ink">Last 14 days</h2>
              <p className="mb-3 text-xs text-muted">Questions answered per day</p>
              <div className="flex h-32 items-end gap-1.5" role="img" aria-label="Questions answered per day, last 14 days">
                {s.last14.map((d, i) => (
                  <div key={i} className="flex flex-1 flex-col items-center gap-1" title={`${d.title}: ${d.n}`}>
                    <div className="flex w-full flex-1 items-end"><div className={cx('w-full rounded-t', d.n ? 'bg-forest' : 'bg-line')} style={{ height: `${d.n ? Math.max(8, (d.n / maxDay) * 100) : 4}%` }} /></div>
                    <span className="text-[9px] text-muted">{d.label}</span>
                  </div>
                ))}
              </div>
            </section>
          </div>

          <section className="mt-4 rounded-2xl border border-line bg-card p-5">
            <h2 className="font-display text-2xl text-ink">By subject</h2>
            <div className="mt-3 grid gap-3 sm:grid-cols-2">
              {SUBJECTS.filter((sub) => s.subj[sub.key]).map((sub) => {
                const v = s.subj[sub.key];
                const pct = Math.round((v.c / v.a) * 100);
                return (
                  <div key={sub.key}>
                    <div className="mb-1 flex items-center justify-between text-xs"><span className="font-medium text-ink">{sub.short}</span><span className="tabular text-muted">{pct}% · {v.a} answered</span></div>
                    <BreakdownBar correct={v.c} wrong={v.a - v.c} total={v.a} />
                  </div>
                );
              })}
            </div>
          </section>

          <section className="mt-4 rounded-2xl border border-line bg-card p-5">
            <div className="flex items-center justify-between gap-3">
              <h2 className="font-display text-2xl text-ink">Session log</h2>
              <button type="button" onClick={onClear} className="inline-flex items-center gap-1.5 rounded-lg px-3 py-2 text-xs font-semibold text-rose hover:bg-rose-soft"><Icon name="trash" className="h-3.5 w-3.5" /> Clear all</button>
            </div>
            <ul className="mt-2 divide-y divide-line">
              {history.slice(0, visible).map((r) => (
                <li key={r.id} className="flex items-center gap-3 py-3">
                  <div className={cx('grid h-12 w-12 shrink-0 place-items-center rounded-xl font-display text-xl', r.accuracy >= 70 ? 'bg-mint text-forest' : r.accuracy >= 40 ? 'bg-amber-soft text-amber' : 'bg-rose-soft text-rose')}>{r.accuracy}</div>
                  <div className="min-w-0 flex-1">
                    <div className="text-sm font-medium text-ink">{new Date(r.finishedAt).toLocaleDateString(undefined, { weekday: 'short', day: 'numeric', month: 'short' })} · {r.correct}/{r.answered} correct{r.skipped ? ` · ${r.skipped} skipped` : ''}</div>
                    <div className="truncate text-xs text-muted">{Object.keys(r.bySubject || {}).join(', ') || '—'} · {r.mode === 'timed' ? 'Timed' : 'Relaxed'} · {formatMinutes(r.elapsed)}{r.retry ? ' · Retry' : ''}</div>
                  </div>
                  <button type="button" onClick={() => onDelete(r.id)} aria-label="Delete this session" className="grid h-10 w-10 place-items-center rounded-full text-muted hover:bg-rose-soft hover:text-rose"><Icon name="trash" className="h-4 w-4" /></button>
                </li>
              ))}
            </ul>
            {visible < history.length && <button type="button" onClick={() => setVisible((v) => v + 12)} className="mt-2 w-full rounded-xl border border-line py-2.5 text-sm font-semibold text-ink hover:bg-mint/50">Show more</button>}
          </section>
        </>
      )}
    </div>
  );
}

function App() {
  const [questions, setQuestions] = useState([]);
  const [status, setStatus] = useState('loading');
  const [loadInfo, setLoadInfo] = useState({ failed: [] });
  const [view, setView] = useState('dashboard');
  const [session, setSession] = useState(() => readStorage(STORAGE.session, null));
  const [flags, setFlags] = useState(() => {
    const saved = readStorage(STORAGE.flags, []);
    return new Set(Array.isArray(saved) ? saved : []);
  });
  const [draft, setDraft] = useState(() => {
    const saved = readStorage(STORAGE.prefs, null);
    const merged = { ...DEFAULT_DRAFT, ...(saved || {}) };
    if (!Array.isArray(merged.subjects)) merged.subjects = DEFAULT_DRAFT.subjects;
    merged.subjects = merged.subjects.filter((key) => SUBJECT_MAP[key]);
    return merged;
  });
  const [theme, setTheme] = useState(() => (document.documentElement.classList.contains('dark') ? 'dark' : 'light'));
  const [notes, setNotes] = useState(() => { const n = readStorage(STORAGE.notes, {}); return n && typeof n === 'object' ? n : {}; });
  const [history, setHistory] = useState(() => { const h = readStorage(STORAGE.history, []); return Array.isArray(h) ? h : []; });
  const [loadProgress, setLoadProgress] = useState(null);
  const [toast, setToast] = useState(null);
  const [confirm, setConfirm] = useState(null);
  const [printData, setPrintData] = useState(null);
  const bootRef = useRef(false);

  const showToast = useCallback((message, icon = 'checkCircle') => {
    setToast({ message, icon, id: Date.now() });
  }, []);

  useEffect(() => {
    if (!toast) return undefined;
    const timer = setTimeout(() => setToast(null), 2800);
    return () => clearTimeout(timer);
  }, [toast]);

  useEffect(() => {
    let cancelled = false;
    loadQuestionBank(setLoadProgress)
      .then(({ questions: loaded, failed, dropped, duplicates }) => {
        if (cancelled) return;
        if (!loaded.length) {
          setStatus('error');
          setLoadInfo({ failed, dropped, error: 'No valid questions were found in the data folder.' });
          return;
        }
        setQuestions(loaded);
        setStatus('ready');
        setLoadInfo({ failed, dropped, duplicates });
        if (failed.length) {
          showToast(`Loaded ${formatCount(loaded.length)} questions. ${failed.length} file${failed.length === 1 ? '' : 's'} could not be read.`, 'alert');
        }
      })
      .catch((err) => {
        if (cancelled) return;
        setStatus('error');
        setLoadInfo({ failed: [], error: err && err.message ? err.message : 'Could not load the question bank.' });
      });
    return () => {
      cancelled = true;
    };
  }, [showToast]);

  useEffect(() => {
    if (status !== 'ready' || bootRef.current) return;
    bootRef.current = true;
    if (!session) return;
    if (!Array.isArray(session.questionIds) || !session.questionIds.length) {
      setSession(null);
      removeStorage(STORAGE.session);
      return;
    }
    const known = new Set(questions.map((q) => q.id));
    const validIds = session.questionIds.filter((id) => known.has(id));
    if (!validIds.length) {
      setSession(null);
      removeStorage(STORAGE.session);
      return;
    }
    const restored = {
      ...session,
      questionIds: validIds,
      index: clamp(session.index || 0, 0, Math.max(0, validIds.length - 1))
    };
    setSession(restored);
    if (!restored.finished) {
      setView('practice');
      showToast(`Session restored — question ${restored.index + 1} of ${validIds.length}.`, 'rotate');
    }
  }, [questions, session, showToast, status]);

  useEffect(() => {
    if (status !== 'ready') return;
    const known = new Set(questions.map((q) => q.id));
    setFlags((prev) => {
      const next = new Set(Array.from(prev).filter((id) => known.has(id)));
      return next.size === prev.size ? prev : next;
    });
  }, [questions, status]);

  useEffect(() => {
    const timer = setTimeout(() => {
      if (session) writeStorage(STORAGE.session, session);
      else removeStorage(STORAGE.session);
    }, 300);
    return () => clearTimeout(timer);
  }, [session]);

  useEffect(() => {
    writeStorage(STORAGE.flags, Array.from(flags));
  }, [flags]);

  useEffect(() => {
    document.documentElement.classList.toggle('dark', theme === 'dark');
    try { localStorage.setItem(STORAGE.theme, theme); } catch (e) { /* noop */ }
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#0D1210' : '#F5F2EA');
  }, [theme]);

  useEffect(() => {
    const t = setTimeout(() => writeStorage(STORAGE.notes, notes), 300);
    return () => clearTimeout(t);
  }, [notes]);

  useEffect(() => {
    writeStorage(STORAGE.history, history);
  }, [history]);

  useEffect(() => {
    let shown = false;
    const h = () => {
      if (shown) return;
      shown = true;
      showToast('Browser storage is unavailable. Progress will not be saved.', 'alert');
    };
    window.addEventListener('cadence-storage-error', h);
    return () => window.removeEventListener('cadence-storage-error', h);
  }, [showToast]);

  useEffect(() => {
    writeStorage(STORAGE.prefs, draft);
  }, [draft]);

  const questionsById = useMemo(() => {
    const map = {};
    questions.forEach((q) => {
      map[q.id] = q;
    });
    return map;
  }, [questions]);

  const subjectCounts = useMemo(() => {
    const counts = {};
    questions.forEach((q) => {
      counts[q.subject] = (counts[q.subject] || 0) + 1;
    });
    return counts;
  }, [questions]);

  const sessionRef = useRef(session);
  sessionRef.current = session;
  const questionsByIdRef = useRef({});
  questionsByIdRef.current = questionsById;

  const qStats = useMemo(() => {
    const m = {};
    history.forEach((r) => {
      Object.entries(r.results || {}).forEach(([id, ok]) => {
        const e = m[id] || (m[id] = { right: 0, wrong: 0 });
        if (ok) e.right += 1;
        else e.wrong += 1;
      });
    });
    return m;
  }, [history]);

  const toggleTheme = useCallback(() => setTheme((t) => (t === 'dark' ? 'light' : 'dark')), []);

  const setNote = useCallback((id, patch) => {
    setNotes((prev) => {
      const next = { ...(prev[id] || { text: '', tags: [] }), ...patch };
      const copy = { ...prev };
      if (!next.text && !(next.tags || []).length) delete copy[id];
      else copy[id] = next;
      return copy;
    });
  }, []);

  const recordHistory = useCallback(() => {
    const s = sessionRef.current;
    if (!s || s.finished) return;
    const map = questionsByIdRef.current;
    const results = {};
    const bySubject = {};
    let correct = 0;
    let answered = 0;
    Object.entries(s.answers || {}).forEach(([id, a]) => {
      const q = map[id];
      if (!q || !a) return;
      const ok = a.correct ? 1 : 0;
      answered += 1;
      correct += ok;
      results[id] = ok;
      const b = bySubject[q.subject] || (bySubject[q.subject] = { a: 0, c: 0 });
      b.a += 1;
      b.c += ok;
    });
    if (!answered) return;
    const total = (s.questionIds || []).length;
    const rec = {
      id: s.id, finishedAt: Date.now(), total, answered, correct, wrong: answered - correct,
      skipped: Math.max(0, total - answered), accuracy: Math.round((correct / answered) * 100),
      elapsed: s.elapsedSec || 0, mode: (s.config && s.config.mode) || 'relaxed', retry: !!s.retryOf, bySubject, results
    };
    setHistory((prev) => [rec, ...prev.filter((r) => r.id !== rec.id)].slice(0, 150));
  }, []);

  const topicCount = useMemo(() => new Set(questions.map((q) => `${q.subject}|${q.topic}`)).size, [questions]);

  const toggleFlag = useCallback(
    (id) => {
      const wasFlagged = flags.has(id);
      setFlags((prev) => {
        const next = new Set(prev);
        if (next.has(id)) next.delete(id);
        else next.add(id);
        return next;
      });
      showToast(wasFlagged ? 'Removed from flagged questions.' : 'Flagged for review.', 'flag');
    },
    [flags, showToast]
  );

  const buildConfig = useCallback(() => {
    const subjects = (draft.subjects || []).filter((key) => SUBJECT_MAP[key]);
    const available = questions.filter((q) => subjects.includes(q.subject)).length;
    const countMode = draft.countMode;
    let target = 0;
    if (countMode === 'all') target = available;
    else if (countMode === 'custom') target = clamp(Number(draft.customCount) || 0, 0, available);
    else target = Math.min(Number(countMode) || 0, available);
    return { ...draft, subjects, target };
  }, [draft, questions]);

  const startSession = useCallback(
    (config) => {
      let pool = questions.filter((q) => config.subjects.includes(q.subject));
      if (config.shuffle) pool = shuffleArray(pool);
      const target = clamp(config.target, 0, pool.length);
      const selected = pool.slice(0, target);
      if (!selected.length) {
        showToast('No questions match that selection.', 'alert');
        return;
      }
      const newSession = {
        id: `s_${Date.now()}`,
        createdAt: Date.now(),
        updatedAt: Date.now(),
        config: { ...config, target: selected.length },
        questionIds: selected.map((q) => q.id),
        index: 0,
        answers: {},
        skipped: {},
        elapsedSec: 0,
        finished: false
      };
      setSession(newSession);
      setView('practice');
      showToast(`${formatCount(selected.length)} questions ready. Take your time.`, 'play');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    [questions, showToast]
  );

  const requestStart = useCallback(() => {
    const config = buildConfig();
    if (!config.target) {
      showToast('Pick at least one subject first.', 'alert');
      return;
    }
    if (session && !session.finished) {
      setConfirm({
        title: 'Start a new drill?',
        message: `You have an unfinished session at question ${session.index + 1} of ${session.questionIds.length}. Starting fresh will replace it.`,
        confirmLabel: 'Start new drill',
        tone: 'default',
        onConfirm: () => startSession(config)
      });
      return;
    }
    startSession(config);
  }, [buildConfig, session, showToast, startSession]);

  const finishSession = useCallback(
    (reason = 'complete') => {
      recordHistory();
      setSession((prev) => (prev ? { ...prev, finished: true, finishedAt: Date.now(), finishReason: reason, updatedAt: Date.now() } : prev));
      setView('summary');
      if (reason === 'time') showToast('Time is up. Here is your breakdown.', 'clock');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    [showToast, recordHistory]
  );

  const requestExit = useCallback(() => {
    setConfirm({
      title: 'Leave this drill?',
      message: 'Your answers and flags are saved automatically. You can resume from the dashboard whenever you like.',
      confirmLabel: 'Save & exit',
      tone: 'default',
      onConfirm: () => {
        setView('dashboard');
        showToast('Progress saved. Resume anytime.', 'checkCircle');
      }
    });
  }, [showToast]);

  const discardSession = useCallback(() => {
    setConfirm({
      title: 'Discard this session?',
      message: 'This clears the current drill’s progress. Your flagged questions stay in the study shelf.',
      confirmLabel: 'Discard session',
      tone: 'danger',
      onConfirm: () => {
        setSession(null);
        removeStorage(STORAGE.session);
        setView('dashboard');
        showToast('Session discarded.', 'trash');
      }
    });
  }, [showToast]);

  const retryQuestions = useCallback(
    (ids) => {
      if (!ids || !ids.length) return;
      setSession((prev) => {
        if (!prev) return prev;
        return {
          ...prev,
          id: `s_${Date.now()}`,
          createdAt: Date.now(),
          updatedAt: Date.now(),
          questionIds: ids,
          index: 0,
          answers: {},
          skipped: {},
          elapsedSec: 0,
          finished: false,
          finishedAt: null,
          finishReason: null,
          config: { ...prev.config, countMode: 'custom', customCount: ids.length, target: ids.length, shuffle: false },
          retryOf: prev.id
        };
      });
      setView('practice');
      showToast(`${ids.length} question${ids.length === 1 ? '' : 's'} ready for another pass.`, 'rotate');
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    [showToast]
  );

  const navigate = useCallback(
    (next) => {
      if (next === 'summary' && !(session && session.finished)) {
        setView('dashboard');
      } else {
        setView(next);
      }
      window.scrollTo({ top: 0, behavior: 'smooth' });
    },
    [session]
  );

  const handlePrint = useCallback(
    (list, title, subtitle) => {
      if (!list || !list.length) {
        showToast('Nothing to export yet.', 'alert');
        return;
      }
      setPrintData({ questions: list, title, subtitle, generatedAt: new Date() });
    },
    [showToast]
  );

  useEffect(() => {
    if (!printData) return undefined;
    const after = () => setPrintData(null);
    window.addEventListener('afterprint', after);
    const timer = setTimeout(() => window.print(), 300);
    return () => {
      clearTimeout(timer);
      window.removeEventListener('afterprint', after);
    };
  }, [printData]);

  const handleManualFiles = useCallback(
    async (fileList) => {
      const files = Array.from(fileList || []);
      if (!files.length) return;
      setStatus('loading');
      try {
        const parsed = await Promise.all(
          files.map(async (file) => {
            const text = await file.text();
            const data = JSON.parse(text);
            if (!Array.isArray(data)) throw new Error(`${file.name} is not a JSON array.`);
            return { key: inferSourceKey(file.name), data };
          })
        );
        const collected = [];
        const dropped = [];
        parsed.forEach(({ key, data }) => {
          data.forEach((raw, idx) => {
            const q = normalizeQuestion(raw, key, idx);
            if (q) collected.push(q);
            else dropped.push({ file: `manual:${key}`, index: idx, reason: diagnose(raw, key), preview: String((raw && raw.question) || '').slice(0, 70) });
          });
        });
        const deduped = dedupeQuestions(collected);
        if (!deduped.length) throw new Error('No valid questions were found in those files.');
        setQuestions(deduped);
        setStatus('ready');
        setLoadInfo({ failed: [], dropped, manual: true });
        showToast(`Loaded ${formatCount(deduped.length)} questions from ${files.length} files.`, 'checkCircle');
      } catch (err) {
        setStatus('error');
        setLoadInfo({ failed: [], error: err && err.message ? err.message : 'Could not read those files.' });
      }
    },
    [showToast]
  );

  const deleteSession = (id) => setHistory((prev) => prev.filter((r) => r.id !== id));
  const clearHistory = () =>
    setConfirm({
      title: 'Clear all history?',
      message: 'This deletes every saved session and the Missed / Correct counts in the question bank. Flags and notes stay. Consider downloading a backup first.',
      confirmLabel: 'Clear history',
      tone: 'danger',
      onConfirm: () => { setHistory([]); showToast('History cleared.', 'trash'); }
    });

  const exportBackup = () => {
    const blob = new Blob([JSON.stringify({ app: 'cadence', version: 1, exportedAt: new Date().toISOString(), history, notes, flags: Array.from(flags) }, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `cadence-backup-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    showToast('Backup downloaded.', 'download');
  };

  const importBackup = async (file) => {
    try {
      const data = JSON.parse(await file.text());
      if (!data || data.app !== 'cadence') throw new Error('That is not a Cadence backup file.');
      if (Array.isArray(data.history)) {
        setHistory((prev) => {
          const ids = new Set(prev.map((r) => r.id));
          return [...prev, ...data.history.filter((r) => r && r.id && !ids.has(r.id))].sort((a, b) => b.finishedAt - a.finishedAt).slice(0, 150);
        });
      }
      if (data.notes && typeof data.notes === 'object') setNotes((prev) => ({ ...data.notes, ...prev }));
      if (Array.isArray(data.flags)) setFlags((prev) => new Set([...prev, ...data.flags]));
      showToast('Backup restored.', 'checkCircle');
    } catch (err) {
      showToast(err && err.message ? err.message : 'Could not read that backup.', 'alert');
    }
  };

  const ctxValue = { theme, toggleTheme, notes, setNote };

  if (status === 'loading') return <LoadingScreen progress={loadProgress} />;
  if (status === 'error') return <ErrorScreen info={loadInfo} onManual={handleManualFiles} />;

  const hasFinished = !!(session && session.finished);
  const showPractice = view === 'practice' && session && !session.finished;
  const navView = view === 'summary' && !hasFinished ? 'dashboard' : view;

  return (
    <AppCtx.Provider value={ctxValue}>
    <div className="min-h-screen bg-paper text-ink">
      <div className="paper-grain pointer-events-none fixed inset-0 z-0 opacity-50" />

      {showPractice ? (
        <div className="screen-app relative z-10">
          <Practice
            questionsById={questionsById}
            session={session}
            setSession={setSession}
            flags={flags}
            toggleFlag={toggleFlag}
            onExit={requestExit}
            onFinish={finishSession}
            prefs={draft}
            showToast={showToast}
            paused={!!confirm}
          />
        </div>
      ) : (
        <div className="screen-app relative z-10 flex min-h-screen flex-col">
          <Header view={navView} onNavigate={navigate} flagsCount={flags.size} hasResult={hasFinished} />
          <main className="mx-auto w-full max-w-6xl flex-1 px-5 pb-20">
            <DataHealth info={loadInfo} />
            {view === 'summary' && hasFinished ? (
              <Summary
                session={session}
                questionsById={questionsById}
                flags={flags}
                toggleFlag={toggleFlag}
                onRetry={retryQuestions}
                onNew={() => navigate('dashboard')}
                onNavigate={navigate}
              />
            ) : view === 'bank' ? (
              <QuestionBank questions={questions} flags={flags} toggleFlag={toggleFlag} qStats={qStats} />
            ) : view === 'history' ? (
              <HistoryView history={history} onDelete={deleteSession} onClear={clearHistory} onExport={exportBackup} onImport={importBackup} onNavigate={navigate} />
            ) : view === 'flagged' ? (
              <FlaggedHub
                questions={questions}
                flags={flags}
                toggleFlag={toggleFlag}
                session={session}
                onPrint={handlePrint}
                onNavigate={navigate}
              />
            ) : (
              <Dashboard
                questions={questions}
                subjectCounts={subjectCounts}
                topicCount={topicCount}
                flagsCount={flags.size}
                draft={draft}
                setDraft={setDraft}
                onStart={requestStart}
                session={session}
                onResume={() => setView('practice')}
                onDiscard={discardSession}
                onViewSummary={() => navigate('summary')}
                onNavigate={navigate}
              />
            )}
          </main>
          <Footer />
        </div>
      )}

      <Modal
        open={!!confirm}
        title={confirm ? confirm.title : ''}
        tone={confirm ? confirm.tone : 'default'}
        onClose={() => setConfirm(null)}
        footer={
          confirm ? (
            <>
              <button
                type="button"
                onClick={() => setConfirm(null)}
                className="rounded-xl border border-line bg-white px-4 py-2.5 text-sm font-semibold text-ink transition hover:bg-paper"
              >
                Cancel
              </button>
              <button
                type="button"
                onClick={() => {
                  const action = confirm.onConfirm;
                  setConfirm(null);
                  if (action) action();
                }}
                className={cx(
                  'rounded-xl px-4 py-2.5 text-sm font-semibold text-white transition',
                  confirm.tone === 'danger' ? 'bg-rose hover:bg-rose/90' : 'bg-forest hover:bg-forest-dark'
                )}
              >
                {confirm.confirmLabel}
              </button>
            </>
          ) : null
        }
      >
        {confirm ? confirm.message : null}
      </Modal>

      <Toast toast={toast} />
      {printData && <PrintSheet data={printData} />}
    </div>
    </AppCtx.Provider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<ErrorBoundary><App /></ErrorBoundary>);
  </script>
</body>
</html>
